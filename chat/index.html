<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A56DB">
<title>채팅 시험대 — RChatAI</title>
<!--
  채팅 시험대 — **앱의 AI 상담 화면 그대로**를 웹으로 옮긴 것.

  왜: 채팅을 고쳐도 앱에 실려야 확인이 되니 석현 님 배포를 기다려야 했다(2026-08-19 대표님 지시).
      서버(Edge Function)는 우리가 언제든 배포하므로, 손님 화면 역할만 이 페이지가 대신한다.
      대표님이 여기서 케이스를 눌러 보고 "이 양식을 이렇게 바꿔라"고 말하면 이 파일을 고친다.
      최종본이 정리되면 그때 석현 님에게 넘겨 앱에 반영한다.

  규율 (이 파일을 고칠 때 반드시 지킬 것):
   1. 화면은 앱 chat.tsx의 **실제 값**을 옮긴다 — 색은 app/src/lib/theme.ts, 치수는 chat.tsx의 StyleSheet.
      임의로 예쁘게 바꾸지 않는다. 여기서만 예쁜 화면은 앱에 옮길 수 없다.
   2. 서버로 가는 것은 앱과 글자 그대로 같다:
      {device_id, session_id?, message, identification_id?, client_msg_uid}
      SSE 파싱·표 분해·사진 정규화·1280px 축소·식별 한 턴 이어붙이기 모두 앱 규칙 그대로.
   3. 앱에 없는 것(맨 위 시험용 줄, 서버 원문 패널)은 **전화기 틀 바깥**에만 둔다. 틀 안은 앱과 같아야 한다.
   4. 접속 열쇠는 AES-GCM으로 잠가 둔다 — 비밀번호 없이는 함수를 부를 수 없다(요금 보호).

  옮겨온 자리 (앱 → 여기)
   - lib/theme.ts            → :root 변수 (색·간격·모서리·터치 48)
   - chat.tsx StyleSheet     → 아래 CSS 클래스 (이름 옆에 원본 스타일명을 적어 두었다)
   - chat.tsx GREETING·칩    → GREETING · CHIPS
   - chat.tsx parseBlocks    → parseBlocks()   (구분행은 둘째 줄일 때만·실패 시 원문 폴백)
   - chat.tsx renderActions  → renderActions() (첫 버튼만 채운 스타일, send_text는 마지막 버블에만)
   - chat.tsx runAction      → runAction()
-->
<style>
  /* ── 앱 디자인 토큰 (app/src/lib/theme.ts 그대로) ───────────────────────── */
  :root{
    --primary600:#1A56DB; --primary700:#1443AE; --primary50:#EAF1FD;
    --bg:#FFFFFF; --bgSubtle:#F5F7FA; --border:#E5E8EE;
    --textPrimary:#111827; --textSecondary:#4B5563; --textDisabled:#9CA3AF;
    --success600:#15803D; --success50:#E7F6EC;
    --warning700:#92400E; --warning50:#FEF3C7;
    --danger600:#DC2626; --danger50:#FDECEC;
    --neutral600:#4B5563; --neutral100:#F3F4F6;
    --xs:4px; --sm:8px; --md:12px; --lg:16px; --xl:24px; --xxl:32px;
    --rCard:16px; --rControl:12px; --rPill:999px;
    --touch:48px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:#20262E;overflow:hidden;
       font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif}
  button,input,textarea,select{font-family:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none;padding:0}

  /* ── 비밀번호 문 ───────────────────────────────────────────────────────── */
  #gate{position:fixed;inset:0;display:grid;place-items:center;background:#20262E;z-index:90;padding:20px}
  #gate form{width:100%;max-width:320px;background:var(--bg);border-radius:var(--rCard);padding:24px;display:grid;gap:12px}
  #gate h1{font-size:20px;line-height:28px;font-weight:600;margin:0;color:var(--textPrimary)}
  #gate p{margin:0;font-size:14px;line-height:20px;color:var(--textSecondary)}
  #gate input{min-height:var(--touch);background:var(--bgSubtle);border:1px solid var(--border);border-radius:var(--rControl);padding:0 var(--lg);font-size:16px}
  #gate button{min-height:56px;border-radius:var(--rControl);background:var(--primary600);color:#fff;font-size:16px;font-weight:600}
  #gateErr{color:var(--danger600);font-size:14px;font-weight:600;min-height:20px}

  /* ── 시험용 겉틀 (앱에는 없다) ─────────────────────────────────────────── */
  #desk{display:none;height:100%;flex-direction:column}
  #desk.on{display:flex}
  #devbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
          padding:6px 12px;background:#161B21;color:#9AA6B2;font-size:12px;border-bottom:1px solid #2B333C}
  #devbar .tag{background:#2B333C;color:#C6D0DA;border-radius:4px;padding:2px 7px;font-weight:700;letter-spacing:.04em}
  #devbar .st{font-family:Consolas,ui-monospace,monospace;font-size:11.5px}
  #devbar .st b{color:#E4EAF0}
  #devbar button,#devbar select{background:#2B333C;color:#C6D0DA;border:1px solid #3A444F;border-radius:5px;
                                padding:5px 10px;font-size:12px;font-weight:600}
  #devbar button:hover{background:#3A444F;color:#fff}
  #devbar .sp{flex:1}
  #stage{flex:1 1 auto;display:flex;min-height:0;justify-content:center;gap:14px;padding:14px;overflow:hidden}

  /* 전화기 틀 — 이 안쪽은 앱 화면이다 */
  #phone{position:relative;width:100%;min-width:0;max-width:412px;height:100%;background:var(--bgSubtle);
         border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  @media (max-width:760px){ #stage{padding:0} #phone{max-width:none;border-radius:0;box-shadow:none} }

  /* ── 앱 헤더 (s.header · s.logo · s.newChatButton · s.historyButton · s.callButton) ── */
  .app-header{flex:0 0 auto;display:flex;align-items:center;background:var(--bg);
              padding:18px var(--lg) var(--md);border-bottom:1px solid var(--border)}
  .app-logo{width:40px;height:40px;border-radius:10px;background:var(--primary600);display:grid;place-items:center;
            color:#fff;font-size:16px;line-height:24px;font-weight:600;flex:0 0 auto}
  .app-title{flex:1;min-width:0;margin-left:var(--md);margin-right:var(--xs);font-size:18px;line-height:26px;font-weight:600;
             color:var(--textPrimary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-newchat{width:40px;height:40px;border-radius:20px;background:var(--primary50);display:grid;place-items:center;margin-right:2px;flex:0 0 auto}
  .app-history{min-width:48px;min-height:48px;display:grid;place-items:center;margin-right:4px;flex:0 0 auto}
  .app-history span{font-size:14px;line-height:20px;font-weight:600;color:var(--primary600)}
  .app-call{display:flex;align-items:center;border:1.5px solid var(--primary600);border-radius:var(--rPill);
            padding:0 var(--md);min-height:40px;flex:0 0 auto}
  .app-call span{font-size:14px;line-height:20px;font-weight:600;color:var(--primary600);margin-left:4px}

  /* ── 대화 영역 (ScrollView contentContainerStyle: padding 16 · gap 12) ──── */
  #scroll{flex:1 1 auto;overflow-y:auto;padding:var(--lg);display:flex;flex-direction:column;gap:var(--md);
          background:var(--bgSubtle);-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #scroll::-webkit-scrollbar{display:none}
  .turn{display:flex;flex-direction:column;gap:var(--md);min-width:0}

  .b-assistant{background:var(--bg);border:1px solid var(--border);border-radius:var(--rCard);border-top-left-radius:4px;
               padding:var(--lg);align-self:flex-start;max-width:88%;
               font-size:16px;line-height:24px;color:var(--textPrimary);white-space:pre-wrap;word-break:break-word}
  .b-user{background:var(--primary600);border-radius:var(--rCard);border-top-right-radius:4px;
          padding:var(--lg);align-self:flex-end;max-width:88%;
          font-size:16px;line-height:24px;color:#fff;white-space:pre-wrap;word-break:break-word}
  .b-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rCard);border-top-left-radius:4px;
          padding:var(--lg);align-self:stretch}
  .b-left{align-self:flex-start;max-width:88%;display:flex;flex-direction:column}
  .b-stretch{align-self:stretch;display:flex;flex-direction:column}
  .blocks{display:flex;flex-direction:column;gap:var(--md)}
  .blocks>p{margin:0;font-size:16px;line-height:24px;color:var(--textPrimary);white-space:pre-wrap}

  /* 표 카드 (s.specTable · s.specRow · s.modelRow) — 파이프 문자 대신 카드로 */
  .spec{background:var(--bgSubtle);border:1px solid var(--border);border-radius:var(--rControl);padding:0 var(--md)}
  .spec .r2{display:flex;align-items:flex-start;gap:var(--sm);padding:var(--sm) 0}
  .spec .r2+.r2,.spec .r3+.r3{border-top:1px solid var(--border)}
  .spec .r2 .k{font-size:14px;line-height:20px;color:var(--textSecondary);min-width:88px;flex-shrink:1}
  .spec .r2 .v{font-size:16px;line-height:24px;color:var(--textPrimary);flex:1}
  .spec .r3{padding:var(--sm) 0}
  .spec .r3 .n{font-size:16px;line-height:24px;font-weight:600;color:var(--textPrimary)}
  .spec .r3 .s{font-size:14px;line-height:20px;color:var(--textSecondary);margin-top:2px}

  /* 답변 아래 제품 사진 (s.photoCard · s.photoImage) */
  .photos{display:flex;flex-wrap:wrap;gap:var(--sm);margin-top:var(--sm)}
  .photo{width:132px;border:1px solid var(--border);border-radius:var(--rCard);overflow:hidden;background:var(--bg);
         text-align:left;cursor:pointer}
  .photo img{width:100%;height:110px;object-fit:contain;background:var(--bgSubtle);display:block}
  /* 설명은 2줄까지 (앱 numberOfLines={2}). -webkit-line-clamp는 이 크롬에서 flow-root로 뭉개져
     3번째 줄이 반쯤 남았다 — 높이로 자르고 말줄임은 clampLines()가 글자로 붙인다. */
  .photo .cap{padding:var(--sm);font-size:14px;line-height:20px;color:var(--textSecondary);
              overflow:hidden;max-height:56px}

  /* 버튼 행 (s.actionPrimary = 첫 번째 · s.quickButton = 나머지) */
  .acts{display:flex;flex-wrap:wrap;gap:var(--sm);margin-top:var(--sm)}
  .act{display:flex;align-items:center;justify-content:center;border-radius:var(--rPill);
       padding:0 var(--lg);min-height:var(--touch);font-size:16px;line-height:24px;font-weight:600}
  .act.pri{background:var(--primary600);color:#fff}
  .act.sec{background:var(--bg);border:1px solid var(--primary600);color:var(--primary600)}
  .act[disabled]{opacity:.5}

  /* 후보 카드 (s.candidateRow · s.badge · s.confirmButton) */
  .cand{display:flex;align-items:center;gap:var(--md);border-top:1px solid var(--border);padding-top:var(--md);margin-top:var(--md)}
  .thumb{border-radius:var(--rControl);overflow:hidden;background:var(--bgSubtle);border:1px solid var(--border);
         display:grid;place-items:center;flex:0 0 auto}
  .thumb img{width:100%;height:100%;object-fit:contain}
  .badge{border-radius:var(--rPill);padding:3px 10px;font-size:14px;line-height:20px;font-weight:600;display:inline-block}
  .badge.high{background:var(--success50);color:var(--success600)}
  .badge.medium{background:var(--warning50);color:var(--warning700)}
  .badge.low{background:var(--neutral100);color:var(--neutral600)}
  .cand .info{flex:1;min-width:0}
  .cand .mno{font-size:16px;line-height:24px;font-weight:600;color:var(--textPrimary);margin-top:4px}
  .cand .pn{font-size:14px;line-height:20px;color:var(--textSecondary);margin-top:2px;
            overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cand .pr{font-size:16px;line-height:24px;font-weight:600;color:var(--textPrimary);margin-top:4px}
  .cand .pr small{font-size:14px;font-weight:400;color:var(--textSecondary);margin-left:8px}
  .btn-confirm{min-width:76px;min-height:var(--touch);border-radius:var(--rControl);background:var(--primary600);
               color:#fff;font-size:16px;font-weight:600;padding:0 var(--md);flex:0 0 auto}
  .btn-confirm[disabled]{opacity:.6}
  .btn-outline{flex:1;min-height:var(--touch);border-radius:var(--rControl);border:1.5px solid var(--primary600);
               background:var(--bg);color:var(--primary600);font-size:16px;font-weight:600}
  .btn-fill{flex:1;min-height:var(--touch);border-radius:var(--rControl);background:var(--primary600);
            color:#fff;font-size:16px;font-weight:600}

  /* 되묻기 안의 명판 위치 안내 (s.labelHintRow) */
  .hintrow{display:flex;align-items:flex-start;background:var(--primary50);border-radius:var(--rControl);
           padding:var(--sm);margin-top:var(--sm)}
  .hintrow span{font-size:14px;line-height:20px;color:var(--textSecondary);margin-left:4px;flex:1}

  /* 오류 버블 · 다시 시도 (s.retryButton) */
  .b-error{border-color:var(--danger600);background:var(--danger50);color:var(--danger600)}
  .btn-retry{min-height:var(--touch);padding:0 var(--lg);border-radius:var(--rControl);background:var(--danger600);
             color:#fff;font-size:16px;font-weight:600}

  /* 진행 버블 */
  .b-progress{display:flex;align-items:center}
  .b-progress span{font-size:16px;line-height:24px;color:var(--textSecondary);margin-left:var(--sm)}
  .spin{width:20px;height:20px;border:2px solid var(--primary600);border-right-color:transparent;border-radius:50%;
        animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

  /* 날짜 구분 (s.dayRow · s.dayLine) */
  .day{display:flex;align-items:center;margin:var(--xs) 0}
  .day i{flex:1;height:1px;background:var(--border)}
  .day span{font-size:14px;line-height:20px;color:var(--textSecondary);margin:0 var(--sm)}

  /* 손님 사진 버블 (s.userImageBubble · s.userImage) */
  .b-userimg{border-radius:var(--rCard);overflow:hidden;align-self:flex-end;border:1px solid var(--border);background:var(--neutral100)}
  .b-userimg img{width:200px;height:200px;object-fit:cover;display:block}

  /* 첫 화면 칩 (s.chip) */
  .chips{display:flex;flex-wrap:wrap;gap:var(--sm)}
  .chip{background:var(--bg);border:1px solid var(--border);border-radius:var(--rPill);
        padding:0 var(--lg);min-height:var(--touch);display:flex;align-items:center;
        font-size:16px;line-height:24px;color:var(--textPrimary)}

  /* ── 입력바 (s.inputBar · s.cameraButton · s.input · s.sendButton) ─────── */
  .app-input{flex:0 0 auto;display:flex;align-items:flex-end;background:var(--bg);
             padding:var(--sm) var(--md);gap:var(--sm);border-top:1px solid var(--border)}
  .icon-btn{width:var(--touch);height:var(--touch);border-radius:var(--rControl);background:var(--primary50);
            display:grid;place-items:center;flex:0 0 auto}
  .icon-btn.rec{background:var(--danger50)}
  .inwrap{flex:1;min-width:0;position:relative}
  /* 안내 문구는 오버레이로 그린다 — textarea의 placeholder는 두 줄로 감기면서 입력창을 두 줄 높이로
     밀어 올린다(앱이 s.placeholderWrap을 따로 둔 이유와 같다). 한 줄을 넘으면 말줄임. */
  #ph{position:absolute;left:var(--lg);right:var(--lg);top:0;bottom:0;display:flex;align-items:center;
      pointer-events:none;font-size:16px;line-height:22px;color:var(--textDisabled);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #ph.off{display:none}
  #input{width:100%;min-height:var(--touch);max-height:120px;background:var(--bgSubtle);border:none;
         border-radius:var(--rCard);padding:12px var(--lg);font-size:16px;line-height:22px;color:var(--textPrimary);
         resize:none;outline:none}
  #input::placeholder{color:var(--textDisabled)}
  #send{width:var(--touch);height:var(--touch);border-radius:24px;background:var(--primary600);
        display:grid;place-items:center;flex:0 0 auto}
  #send[disabled]{background:var(--textDisabled)}

  /* ── 탭바 ((tabs)/_layout.tsx) ─────────────────────────────────────────── */
  .app-tabs{flex:0 0 auto;display:flex;background:var(--bg);border-top:1px solid var(--border);padding-bottom:6px}
  .app-tabs button{flex:1;min-width:0;display:grid;place-items:center;gap:2px;padding:7px 0 3px;color:var(--textSecondary)}
  .app-tabs button span{font-size:12px;line-height:16px;font-weight:600}
  .app-tabs button.on{color:var(--primary600)}

  /* ── 토스트 (s.toast) ──────────────────────────────────────────────────── */
  #toast{position:absolute;left:var(--lg);right:var(--lg);background:rgba(17,24,39,.92);border-radius:var(--rControl);
         padding:var(--md) var(--lg);color:#fff;font-size:16px;line-height:24px;z-index:10;
         opacity:0;transition:opacity .18s;pointer-events:none}
  #toast.on{opacity:1}

  /* ── 시트 (PhotoGuideSheet · PhotoConfirmSheet · CallHoursSheet) ───────── */
  #sheet{position:absolute;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;z-index:20}
  #sheet.on{display:flex}
  .sheet-box{width:100%;background:var(--bg);border-top-left-radius:var(--xl);border-top-right-radius:var(--xl);
             padding:var(--lg) var(--lg) var(--xl);max-height:86%;overflow-y:auto}
  .sheet-box h2{margin:0 0 var(--md);font-size:20px;line-height:28px;font-weight:600;color:var(--textPrimary)}
  .sheet-box p{margin:0 0 var(--md);font-size:16px;line-height:24px;color:var(--textSecondary)}
  .sheet-box img.prev{width:100%;max-height:44vh;object-fit:contain;background:var(--neutral100);border-radius:var(--rControl)}
  .sheet-row{display:flex;gap:var(--sm);margin-top:var(--lg)}

  /* ── 서버 원문 (앱에는 없다 — 틀 바깥) ─────────────────────────────────── */
  #raw{width:420px;flex:0 0 auto;background:#161B21;border:1px solid #2B333C;border-radius:10px;
       display:none;flex-direction:column;min-height:0;color:#C6D0DA}
  #raw.on{display:flex}
  #raw h3{margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
          color:#7C8794;border-bottom:1px solid #2B333C;display:flex;align-items:center;gap:6px}
  #raw h3 .sp{flex:1}
  #raw h3 button{background:#2B333C;border:1px solid #3A444F;border-radius:4px;color:#C6D0DA;
                 padding:3px 8px;font-size:11px;letter-spacing:0;text-transform:none}
  #rawBody{flex:1 1 auto;overflow:auto;padding:10px 12px;font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;
           font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
  #rawBody .t{color:#5E6B78}
  #rawBody .k-req,#rawBody .k-session{color:#7FB2FF}
  #rawBody .k-req{font-weight:700}
  #rawBody .k-delta{color:#7C8794}
  #rawBody .k-done{color:#7FD8A0;font-weight:700}
  #rawBody .k-error,#rawBody .k-http{color:#FF9B8F;font-weight:700}
  @media (max-width:1100px){ #raw{display:none !important} }

  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:80;padding:16px}
  #lightbox.on{display:grid}
  #lightbox img{max-width:100%;max-height:90vh;object-fit:contain}
</style>
</head>
<body>

<div id="gate">
  <form id="gateForm">
    <h1>채팅 시험대</h1>
    <p>앱의 AI 상담 화면입니다. 비밀번호를 넣어 주세요.</p>
    <input type="password" id="gatePw" autocomplete="current-password" placeholder="비밀번호" autofocus>
    <button type="submit">열기</button>
    <div id="gateErr"></div>
  </form>
</div>

<div id="desk">
  <!-- ══ 이 한 줄은 앱에 없는 시험용 줄 ═══════════════════════════════════ -->
  <div id="devbar">

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   접속 열쇠 — AES-GCM으로 잠긴 {url, anon}. 형식: "RCHT1"(5B)+salt(16B)+iv(12B)+암호문
   ═══════════════════════════════════════════════════════════════════════════ */
const SECRET_B64 = "UkNIVDEN41OOoFI48wkNye12GEq+i60EbFyNllU3C3g0/Lc4usU5FST2ncMHa1x+7Zgvjb4ENqs0YAh9Bb9L6/zCqVw4UvwgD7XTm6MJzHPK+yAmkUzUPL62eaKb1oO2A9dxTWgBplXiGgUrqzJi08/H/4jOFU93O42ARO1dYY/Lb0niVgBOp35exKC5ymQn/tZYWgkNemkBH730Y3hAsF8ZOehlWoBBp8WKPyhKIP2+b/v/AzQh5qq1eL2EeVUmIc3gxyANq3FNkJhM/JLcj/UydZ+6LCBDwfMGsa1Vmo1BFF8BETrxfcTnY5PVSmvfcWA6utg6fF9wEWhZEm7neC20/Qj5ihhD4QTm48bDDwK9CjOwk3c1NE2ivvySkSteMpNqHZCDckKOK2R0+F8bHuEmwYcAiQ/e4CNfjj0=";
const PBKDF2_ITERS = 600000;                 // build.mjs와 반드시 같은 값
let SB_URL = "", ANON = "";

async function unlock(pw){
  const raw = Uint8Array.from(atob(SECRET_B64), c => c.charCodeAt(0));
  if (new TextDecoder().decode(raw.slice(0,5)) !== "RCHT1") throw new Error("열쇠 형식이 다릅니다");
  const salt = raw.slice(5,21), iv = raw.slice(21,33), body = raw.slice(33);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:PBKDF2_ITERS, hash:"SHA-256" },
                                            base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const conf = JSON.parse(new TextDecoder().decode(
    new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, body))));
  SB_URL = conf.url.replace(/\/$/, ""); ANON = conf.anon;
}

/* ═══════════════════════════════════════════════════════════════════════════
   앱에서 그대로 옮긴 문구·값 (chat.tsx)
   ═══════════════════════════════════════════════════════════════════════════ */
const GREETING =
  "안녕하세요, RChatAI 부품 상담입니다.\n\n부품 사진(명판)을 보내주시거나 모델명·궁금한 점을 입력해 주세요. 재고와 가격까지 바로 확인해 드립니다.";

// 첫 진입 칩 — 라벨은 버튼 카탈로그와 글자 단위로 맞춘다. 이모지 금지 (chat.tsx 1441~1449)
const CHIPS = [
  { label:"사진으로 찾기",         act:"photo" },
  { label:"고장 증상으로 물어보기", act:"prefill",   text:"증상: " },
  { label:"재고 확인",             act:"prefill",   text:"재고 확인해 주세요: " },
  { label:"제품 둘러보기",         act:"nav",       to:"홈(제품 둘러보기)" },
  { label:"전화 요청",             act:"callsheet" },
];

const CONFIDENCE_BADGE = {
  high:   { label:"사진 대조 확인", cls:"high" },
  medium: { label:"사진 유사",      cls:"medium" },
  low:    { label:"확인 필요",      cls:"low" },
};

const MAX_PHOTOS = 5;           // 서버 identify MAX_IMAGES와 같은 값이어야 한다

/* ═══════════════════════════════════════════════════════════════════════════
   도구
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const krw = (n) => n == null ? "가격 문의" : n.toLocaleString("ko-KR") + "원";
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));
const publicUrl = (bucket, path) => `${SB_URL}/storage/v1/object/public/${bucket}/${encodeURI(path)}`;
const dayLabel = (ts) => { const d = new Date(ts); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };

let toastT = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.style.bottom = ($(".app-input").offsetHeight + $(".app-tabs").offsetHeight + 8) + "px";
  t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400);
}
function lightbox(src){ const l = $("#lightbox"); l.querySelector("img").src = src; l.classList.add("on"); }
$("#lightbox").onclick = () => $("#lightbox").classList.remove("on");

/** 서버 원문 기록 (앱에 없는 곳) */
function log(kind, text){
  const box = $("#rawBody");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const line = el("div");
  line.appendChild(el("span", "t", new Date().toLocaleTimeString("ko-KR", { hour12:false }) + " "));
  line.appendChild(el("span", "k-" + kind, "[" + kind + "] "));
  line.appendChild(document.createTextNode(text));
  box.appendChild(line);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ═══════════════════════════════════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════════════════════════════════ */
const DEV_KEY = "rchatai.chattest.device", FN_KEY = "rchatai.chattest.fn", PW_KEY = "rchatai.chattest.pw";
let deviceId = localStorage.getItem(DEV_KEY) || (() => { const d = "web-" + uid(); localStorage.setItem(DEV_KEY, d); return d; })();
let sessionId = null;
let fnName = localStorage.getItem(FN_KEY) || "chat";
let lastIdent = null;        // 식별 직후 **다음 텍스트 턴 한 번에만** 실린다 (앱 lastIdentRef)
let sending = false, identifying = false;
let cartVariantIds = new Set();
let ctrl = null;
const msgs = [];             // 화면의 정본

/* ═══════════════════════════════════════════════════════════════════════════
   답변 본문 → 블록 (앱 chat.tsx parseBlocks 그대로)
    - 구분행은 **둘째 줄**에 있을 때만 구분행 (값이 '-'뿐인 데이터 행을 지우면 한 줄이 사라진다)
    - 표로 못 읽으면 그 구간을 **원문 그대로** 되돌린다 (조용히 삼키지 않는다)
   ═══════════════════════════════════════════════════════════════════════════ */
const isTableLine = (l) => /^\s*\|.*\|\s*$/.test(l);
const isDivider   = (l) => /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.includes("-");
const cellsOf     = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());

function parseBlocks(text){
  const lines = text.split("\n"), out = []; let buf = [];
  const flush = () => { const t = buf.join("\n").replace(/^\s*\n+|\n+\s*$/g, ""); if (t.trim()) out.push({ kind:"text", text:t }); buf = []; };
  for (let i = 0; i < lines.length; i++){
    if (!isTableLine(lines[i])) { buf.push(lines[i]); continue; }
    let j = i; while (j < lines.length && isTableLine(lines[j])) j++;
    const group = lines.slice(i, j);
    const hasDivider = group.length >= 2 && isDivider(group[1]);
    const body = (hasDivider ? [group[0], ...group.slice(2)] : group).map(cellsOf);
    const looksHeader = body.length > 0 && (
      (body[0].length === 3 && body[0][0] === "모델명" && body[0][1] === "가격" && body[0][2] === "재고") ||
      (body[0].length === 2 && body[0][0] === "항목" && body[0][1] === "값"));
    const rows = (hasDivider || looksHeader) ? body.slice(1) : body;
    const width = body[0]?.length ?? 0;
    const ok = rows.length >= 1 && width >= 2 && width <= 3 && body.every(r => r.length === width);
    if (ok) { flush(); out.push({ kind:"table", width, rows }); }
    else { buf.push(...group); }        // 원문 폴백
    i = j - 1;
  }
  flush(); return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   화면 그리기 — 앱 chat.tsx renderMsg 계열
   ═══════════════════════════════════════════════════════════════════════════ */
const scrollBottom = () => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; };
const nodeOf = (id) => $(`[data-mid="${id}"]`);

function addMsg(m){ m.id = m.id || uid(); m.ts = m.ts || Date.now(); msgs.push(m); redraw(); return m; }

function redraw(){
  const box = $("#msgs"); box.textContent = "";
  msgs.forEach((m, i) => {
    const prev = msgs[i-1];
    const showDay = !prev || new Date(prev.ts).toDateString() !== new Date(m.ts).toDateString();
    const turn = el("div", "turn"); turn.dataset.mid = m.id;
    if (showDay){
      const d = el("div", "day"); d.appendChild(el("i")); d.appendChild(el("span", null, dayLabel(m.ts))); d.appendChild(el("i"));
      turn.appendChild(d);
    }
    turn.appendChild(renderMsg(m, i === msgs.length - 1));
    box.appendChild(turn);
  });
  clampAll();
  scrollBottom();
}

/** 어시스턴트 본문 — 표는 카드로. 스트리밍 중에는 파싱하지 않는다(반쯤 온 표는 모양이 튄다). */
function renderBody(m){
  const wrap = el("div", "blocks");
  if (m.streaming || !m.text){ wrap.appendChild(el("p", null, m.text || "")); return wrap; }
  const blocks = parseBlocks(m.text);
  if (blocks.length === 1 && blocks[0].kind === "text"){ wrap.appendChild(el("p", null, m.text)); return wrap; }
  for (const b of blocks){
    if (b.kind === "text"){ wrap.appendChild(el("p", null, b.text)); continue; }
    const t = el("div", "spec");
    for (const r of b.rows){
      if (b.width === 2){
        const row = el("div", "r2");
        row.appendChild(el("span", "k", r[0]));
        row.appendChild(el("span", "v", r[1] || "확인 필요"));
        t.appendChild(row);
      } else {
        const row = el("div", "r3");
        row.appendChild(el("div", "n", r[0]));
        // 빈 칸이 있으면 유령 구분자를 남기지 않는다
        const sub = [r[1], r[2]].filter(x => x && x.length).join("  ·  ");
        if (sub) row.appendChild(el("div", "s", sub));
        t.appendChild(row);
      }
    }
    wrap.appendChild(t);
  }
  return wrap;
}

/** 답변이 지목한 제품 사진 줄. 서버가 판정해 보낸 것만 그린다 — 화면에서 고르지 않는다. */
function renderPhotos(m){
  if (!m.photos?.length || m.streaming) return null;
  const box = el("div", "photos");
  for (const p of m.photos){
    const card = el("div", "photo");
    card.setAttribute("role", "button"); card.tabIndex = 0;
    const img = el("img"); img.src = publicUrl(p.bucket, p.path); img.alt = p.name || "제품 사진"; img.loading = "lazy";
    img.onerror = () => { img.removeAttribute("src"); img.alt = ""; };   // 자리는 남긴다 — 앱도 빈 칸을 그린다
    card.appendChild(img);
    if (p.name){ const cap = el("div", "cap", p.name); cap.dataset.full = p.name; card.appendChild(cap); }
    card.onclick = () => lightbox(publicUrl(p.bucket, p.path));
    box.appendChild(card);
  }
  return box;
}

/** 서버가 내려보낸 버튼 행. **첫 번째만 채운 스타일** — 주 액션 규칙을 화면으로 표현한다.
 *  send_text 계열은 문맥 의존이라 **마지막 버블에만** 그린다 (앱 renderActions 그대로). */
function renderActions(m, isLast){
  if (!m.actions?.length || m.streaming) return null;
  const busy = sending || identifying;
  const visible = m.actions.slice(0, 3).filter(a => !(a.action === "send_text" && !isLast));
  if (!visible.length) return null;
  const box = el("div", "acts");
  visible.forEach((a, i) => {
    // 그 모델이 '지금' 장바구니에 있으면 [장바구니 보기]로 바꾼다. 근거는 서버 목록이다.
    const vid = Number(a.payload?.variant_id);
    const swapped = a.action === "cart_add" && Number.isInteger(vid) && cartVariantIds.has(vid);
    const label = swapped ? "장바구니 보기" : a.label;
    const act = swapped ? { id:"btn_cart_open", label, action:"cart_open" } : a;
    const b = el("button", "act " + (i === 0 ? "pri" : "sec"), label);
    if (busy) b.disabled = true;
    b.onclick = () => runAction(act, b);
    box.appendChild(b);
  });
  return box;
}

/** 넘치는 줄을 잘라내고 말줄임을 붙인다 — CSS 줄자르기가 크롬 버전에 따라 안 먹어 글자로 처리한다.
 *  ☠️ **화면에 붙은 뒤에만 잰다** — 떼어 놓은 노드는 높이가 0이라 아무 일도 일어나지 않는다. */
function clampAll(){
  for (const node of document.querySelectorAll("#msgs .cap[data-full]")) clampLines(node, node.dataset.full);
}
function clampLines(node, text){
  node.textContent = text;
  if (node.scrollHeight <= node.clientHeight) return;
  let lo = 0, hi = text.length;
  while (lo < hi){
    const mid = Math.ceil((lo + hi) / 2);
    node.textContent = text.slice(0, mid) + "…";
    if (node.scrollHeight <= node.clientHeight) lo = mid; else hi = mid - 1;
  }
  node.textContent = text.slice(0, lo).replace(/\s+$/, "") + "…";
}

function thumbBox(src, size){
  const b = el("div", "thumb"); b.style.width = size + "px"; b.style.height = size + "px";
  if (src){ const i = el("img"); i.src = src; i.alt = ""; i.onerror = () => i.remove(); i.onclick = () => lightbox(src); b.appendChild(i); }
  return b;
}

/** 진행 버블의 경과 초 — 예상치("15~20초")를 적어두면 실제 편차를 못 따라가 거짓말이 된다.
 *  실측 초를 그대로 센다 (앱 ElapsedText). */
function tickElapsed(node, since){
  const upd = () => {
    if (!node.isConnected) return;
    node.textContent = " " + Math.max(0, Math.round((Date.now() - since)/1000)) + "초";
    setTimeout(upd, 1000);
  };
  upd();
}

function renderMsg(m, isLast){
  if (m.role === "user"){
    if (m.kind === "image"){
      const w = el("div", "b-userimg");
      const img = el("img"); img.src = m.imageUrl; img.alt = "보낸 사진";
      img.onclick = () => lightbox(m.imageUrl);
      w.appendChild(img); return w;
    }
    return el("div", "b-user", m.text);
  }

  if (m.kind === "progress"){
    const w = el("div", "b-assistant b-progress");
    w.appendChild(el("div", "spin"));
    const s = el("span", null, m.text);
    if (m.elapsed){ const e = el("span"); s.appendChild(e); tickElapsed(e, m.ts); }
    w.appendChild(s); return w;
  }

  if (m.kind === "candidates"){
    const w = el("div", "b-stretch");
    const card = el("div", "b-card");
    const h = el("div", null, "사진과 비교한 후보예요");
    h.style.cssText = "font-size:16px;line-height:24px;font-weight:600;color:var(--textPrimary)";
    card.appendChild(h);
    for (const c of (m.candidates ?? [])){
      const row = el("div", "cand");
      row.appendChild(thumbBox(c.thumb, 64));
      const info = el("div", "info");
      const bd = CONFIDENCE_BADGE[c.confidence] ?? CONFIDENCE_BADGE.low;
      info.appendChild(el("span", "badge " + bd.cls, bd.label));
      // model_presumed면 모델번호는 제품군의 임의 대표다 — 번호 대신 "모델 확인 필요"로 그린다
      info.appendChild(el("div", "mno", c.model_presumed ? "모델 확인 필요" : c.model_no));
      info.appendChild(el("div", "pn", c.part_name));
      const pr = el("div", "pr", krw(c.price_krw));
      pr.appendChild(el("small", null, c.availability || ""));
      info.appendChild(pr);
      row.appendChild(info);
      const ok = el("button", "btn-confirm", "맞아요");
      if (c.part_id == null) ok.disabled = true;   // 눌러야 실패를 알게 되지 않도록 처음부터 비활성
      ok.onclick = () => confirmCandidate(m, c, ok);
      row.appendChild(ok);
      card.appendChild(row);
    }
    w.appendChild(card); return w;
  }

  if (m.kind === "confirmed"){
    const c = m.confirmed;
    const w = el("div", "b-stretch");
    const card = el("div", "b-card");
    const head = el("div"); head.style.cssText = "display:flex;align-items:center";
    head.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg>';
    const ht = el("span", null, "이 부품으로 확인했어요");
    ht.style.cssText = "font-size:16px;line-height:24px;font-weight:600;color:var(--success600);margin-left:6px";
    head.appendChild(ht); card.appendChild(head);

    const row = el("div"); row.style.cssText = "display:flex;gap:var(--md);margin-top:var(--sm)";
    row.appendChild(thumbBox(c.thumb, 96));
    const info = el("div"); info.style.flex = "1";
    const nm = el("div", null, c.part_name);           nm.style.cssText = "font-size:18px;line-height:26px;font-weight:600;color:var(--textPrimary)";
    const mo = el("div", null, c.model_no);            mo.style.cssText = "font-size:14px;line-height:20px;color:var(--textSecondary);margin-top:2px";
    const pr = el("div", null, krw(c.price_krw));      pr.style.cssText = "font-size:20px;line-height:28px;font-weight:700;color:var(--textPrimary);margin-top:4px";
    const av = el("div", null, c.availability || "");  av.style.cssText = "font-size:14px;line-height:20px;color:var(--textSecondary);margin-top:2px";
    info.append(nm, mo, pr, av); row.appendChild(info); card.appendChild(row);

    const btns = el("div"); btns.style.cssText = "display:flex;gap:var(--sm);margin-top:var(--md)";
    const detail = el("button", "btn-outline", "제품 상세 보기");
    detail.onclick = () => appOnly(`제품 상세 /product/${c.part_id}`);
    btns.appendChild(detail);
    // 모델이 특정되지 않으면 회색 비활성 버튼 대신 아예 감추고 이유를 글로 알린다
    if (c.variant_id != null){
      const inCart = cartVariantIds.has(c.variant_id);
      const b = el("button", "btn-fill", inCart ? "장바구니 보기" : "장바구니 담기");
      b.onclick = inCart ? () => appOnly("장바구니 화면") : () => addToCart(c.variant_id, b);
      btns.appendChild(b);
    }
    card.appendChild(btns);
    if (c.variant_id == null){
      const n = el("div", null, "모델까지는 특정하지 못했습니다. 제품 상세에서 모델을 선택해 주세요.");
      n.style.cssText = "font-size:14px;line-height:20px;color:var(--textSecondary);margin-top:var(--sm)";
      card.appendChild(n);
    }
    w.appendChild(card); return w;
  }

  if (m.kind === "ask"){
    const w = el("div", "b-left");
    const bub = el("div", "b-assistant"); bub.style.maxWidth = "100%";
    bub.appendChild(el("div", null, m.text));
    if (m.labelHint){
      const h = el("div", "hintrow");
      h.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A56DB" stroke-width="1.9" style="margin-top:2px;flex:0 0 auto"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
      h.appendChild(el("span", null, m.labelHint));
      bub.appendChild(h);
    }
    w.appendChild(bub);
    const box = el("div", "acts");
    const p = el("button", "act sec", "명판 사진 찍기"); p.onclick = startPhoto;
    const c = el("button", "act sec", "전화 요청");      c.onclick = openCallSheet;
    box.append(p, c); w.appendChild(box);
    return w;
  }

  if (m.kind === "error"){
    const w = el("div", "b-left");
    const bub = el("div", "b-assistant b-error", m.text); bub.style.maxWidth = "100%";
    w.appendChild(bub);
    const box = el("div", "acts");
    if (m.retry){ const r = el("button", "btn-retry", "다시 시도"); r.onclick = m.retry; box.appendChild(r); }
    if (m.suggestCall){ const c = el("button", "act sec", "전화 요청"); c.onclick = openCallSheet; box.appendChild(c); }
    if (box.children.length) w.appendChild(box);
    return w;
  }

  // 보통 답변
  const w = el("div", "b-left");
  const bub = el("div", "b-assistant"); bub.style.maxWidth = "100%";
  bub.appendChild(renderBody(m));
  w.appendChild(bub);
  const ph = renderPhotos(m); if (ph) w.appendChild(ph);
  const ac = renderActions(m, isLast); if (ac) w.appendChild(ac);
  return w;
}

/* ═══════════════════════════════════════════════════════════════════════════
   함수 호출
   ═══════════════════════════════════════════════════════════════════════════ */
async function callFn(name, body){
  const res = await fetch(`${SB_URL}/functions/v1/${name}`, {
    method:"POST",
    headers:{ "Authorization":`Bearer ${ANON}`, "Content-Type":"application/json", "apikey":ANON },
    body: JSON.stringify(body),
  });
  const txt = await res.text();
  let json = null; try { json = JSON.parse(txt); } catch { /* JSON 아님 */ }
  if (!res.ok) throw new Error(json?.error || `HTTP ${res.status} ${txt.slice(0,140)}`);
  return json ?? {};
}

/* ═══════════════════════════════════════════════════════════════════════════
   버튼 동작 — 앱 chat.tsx runAction과 같은 분기.
   앱의 다른 화면으로 가는 것들은 여기 화면이 없으므로 "앱이라면 어디로 갔을지"를 알린다.
   조용히 아무 일도 안 하는 버튼은 만들지 않는다.
   ═══════════════════════════════════════════════════════════════════════════ */
const appOnly = (where) => { toast("앱이라면: " + where); log("done", "앱 전용 이동 — " + where); };

async function runAction(a, btn){
  const p = a.payload ?? {};
  log("req", `버튼 [${a.label}] → ${a.action} ${JSON.stringify(p)}`);
  switch (a.action){
    case "photo": startPhoto(); break;
    case "callback": openCallSheet(); break;
    case "product_detail":
      if (Number.isInteger(p.part_id)) appOnly(`제품 상세 /product/${p.part_id}`);
      else { log("error", "product_detail payload에 part_id 없음"); toast("제품 번호가 없습니다"); }
      break;
    case "cart_add": await addToCart(Number(p.variant_id), btn); break;
    case "cart_open": appOnly("장바구니 화면"); break;
    case "send_text": {
      const t = typeof p.text === "string" ? p.text.trim() : "";
      if (!t){ log("error", "send_text payload에 text 없음"); toast("버튼에 보낼 문구가 없습니다"); break; }
      sendText(t); break;
    }
    case "prefill": {
      const t = typeof p.text === "string" ? p.text : "";
      if (!t){ log("error", "prefill payload에 text 없음"); toast("버튼에 채울 문구가 없습니다"); break; }
      $("#input").value = t; $("#input").focus(); grow(); break;
    }
    case "category":
      if (typeof p.code === "string" && p.code) appOnly(`분류 /category/${p.code}`);
      else { log("error", "category payload에 code 없음"); toast("분류 코드가 없습니다"); }
      break;
    case "orders": appOnly("주문 내역 화면"); break;
    case "home":   appOnly("홈 화면"); break;
    default: log("error", "미지원 액션 " + a.action); toast("모르는 버튼입니다: " + a.action);
  }
}

async function addToCart(variantId, btn){
  if (!Number.isInteger(variantId)){ toast("모델이 특정되지 않아 담을 수 없습니다"); return; }
  if (btn) btn.disabled = true;
  try {
    // cart 함수는 모든 action 뒤에 현재 목록 전체를 돌려준다 — 그 응답이 곧 정본이다.
    const r = await callFn("cart", { device_id: deviceId, action:"add", variant_id: variantId, qty: 1 });
    cartVariantIds = new Set((r.items ?? []).map(i => i.variant_id));
    log("done", `cart add ok — 담긴 품목 ${r.items?.length ?? "?"}종`);
    toast("장바구니에 담았습니다");
    redraw();                       // [장바구니 담기] → [장바구니 보기]로 바뀐다
  } catch (e){
    log("error", "cart 실패 — " + e.message);
    toast("장바구니 담기 실패");
    if (btn) btn.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   보내기 — SSE. 요청 본문은 앱 chat.tsx와 글자 그대로 같다.
   ═══════════════════════════════════════════════════════════════════════════ */
function sendText(raw){
  const text = (raw ?? $("#input").value).trim();
  if (!text || sending) return;
  if (raw == null){ $("#input").value = ""; grow(); }
  addMsg({ role:"user", kind:"text", text });
  const ident = lastIdent; lastIdent = null;
  stream(text, uid(), ident);
}

async function stream(text, turnUid, turnIdent){
  sending = true; setSendState();
  const ai = addMsg({ role:"assistant", kind:"text", text:"", streaming:true });

  const body = { device_id: deviceId, message: text, client_msg_uid: turnUid };
  if (sessionId != null) body.session_id = sessionId;
  if (turnIdent != null) body.identification_id = turnIdent;
  log("req", `${fnName} ← ${JSON.stringify(body)}`);

  let acc = "", finished = false, ttfb = null;
  const t0 = performance.now();
  ctrl = new AbortController();

  /** 오류 버블 — 앱과 같은 규칙: save는 [다시 시도] 없음(답이 이미 화면에 있어 중복된다),
   *  busy·save·timeout은 [전화 요청]을 권한다. */
  const fail = (kind, msg, detail) => {
    if (finished) return; finished = true;
    log("error", `${kind} — ${detail ?? msg}`);
    const i = msgs.indexOf(ai);
    if (!acc && i >= 0) msgs.splice(i, 1); else ai.streaming = false;
    const e = { role:"assistant", kind:"error", text: msg,
                suggestCall: kind === "busy" || kind === "save" || kind === "timeout" };
    if (kind !== "save"){
      e.retry = () => { const k = msgs.indexOf(e); if (k >= 0) msgs.splice(k, 1); redraw(); stream(text, turnUid, turnIdent); };
    }
    addMsg(e);
    sending = false; setSendState();
  };

  try {
    const res = await fetch(`${SB_URL}/functions/v1/${fnName}`, {
      method:"POST",
      headers:{ "Authorization":`Bearer ${ANON}`, "Content-Type":"application/json", "apikey":ANON },
      body: JSON.stringify(body), signal: ctrl.signal,
    });
    if (!res.ok){
      const t = await res.text().catch(() => "");
      let m = `HTTP ${res.status}`; try { m = JSON.parse(t).error || m; } catch { /* JSON 아님 */ }
      log("http", `${res.status} — ${t.slice(0,180)}`);
      if (res.status === 429 || res.status === 529) fail("busy", "지금 상담이 몰려 있어요. 잠시 후 다시 시도해 주세요.", m);
      else fail("upstream", "답변을 받지 못했습니다. 잠시 후 다시 시도해 주세요.", m);
      return;
    }

    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    const handle = (o) => {
      const type = typeof o.type === "string" ? o.type : (o.session_id != null ? "session" : "");
      if (type === "session"){
        const sid = Number(o.session_id);
        if (Number.isInteger(sid) && sid > 0){ sessionId = sid; $("#stSession").textContent = sid; }
        log("session", "세션 " + sid);
      } else if (type === "delta"){
        const piece = typeof o.text === "string" ? o.text
                    : typeof o.delta === "string" ? o.delta
                    : typeof o.content === "string" ? o.content : "";
        if (!piece) return;
        if (ttfb == null){ ttfb = Math.round(performance.now() - t0); log("delta", `첫 글자 ${ttfb}ms`); }
        acc += piece; ai.text = acc; patch(ai);
      } else if (type === "done"){
        finished = true;
        if (rafHold){ cancelAnimationFrame(rafHold); rafHold = null; }
        ai.text = acc; ai.streaming = false;
        ai.actions = Array.isArray(o.actions) ? o.actions.slice(0, 3) : undefined;
        ai.photos  = normalizePhotos(o.photos);
        ai.raw = o;
        // done.user_text — 서버가 알아들은 값으로 손님 말풍선을 고쳐 쓰라는 지시. 저장은 원문 그대로다.
        if (typeof o.user_text === "string" && o.user_text){
          const me = [...msgs].reverse().find(x => x.role === "user" && x.kind === "text");
          if (me && me.text !== o.user_text){ log("done", `말풍선 교정: "${me.text}" → "${o.user_text}"`); me.text = o.user_text; }
        }
        log("done", `stop=${o.stop_reason} msg=${o.message_id} 버튼 ${o.actions?.length ?? 0} 사진 ${o.photos?.length ?? 0} 자료 ${o.docs?.length ?? 0} 캐시 ${o.cache_read_input_tokens ?? "—"} · ${((performance.now()-t0)/1000).toFixed(1)}초`);
        if (o.actions?.length) log("done", "버튼 " + o.actions.map(a => `[${a.label}]${a.action}${a.payload ? " " + JSON.stringify(a.payload) : ""}`).join(" "));
        if (o.docs?.length)    log("done", "자료 쪽(앱에 화면 없음) " + o.docs.map(d => `${d.title} ${d.page}쪽`).join(", "));
        redraw();
      } else if (type === "error"){
        const code = typeof o.code === "string" ? o.code : "";
        const m = (typeof o.message === "string" && o.message) ? o.message : "답변을 받지 못했습니다. 잠시 후 다시 시도해 주세요.";
        fail(code === "busy" ? "busy" : code === "save" ? "save" : "upstream", m, `서버 code=${code || "(없음)"}`);
      } else if (type){
        // else 없는 if 체인이 미지 타입을 조용히 삼키던 자리
        log("error", "미지원 SSE 이벤트 " + type);
      }
    };

    for(;;){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).replace(/\r$/, ""); buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        if (payload === "[DONE]"){ finished = true; break; }
        try { handle(JSON.parse(payload)); } catch { log("error", "SSE 파싱 실패 — " + payload.slice(0,120)); }
      }
      if (finished) break;
    }
    if (!finished){
      if (acc){ ai.streaming = false; finished = true; redraw(); }   // done 없이 정상 종료 — 누적분 확정
      else fail("upstream", "답변을 받지 못했습니다. 잠시 후 다시 시도해 주세요.", "done 없이 종료");
    }
  } catch (e){
    if (e.name === "AbortError"){ ai.streaming = false; redraw(); log("error", "중단"); }
    else fail("network", "연결을 확인한 뒤 다시 시도해 주세요.", String(e));
  }
  ctrl = null; sending = false; setSendState();
}

/** 흘려 보이는 동안에는 그 말풍선 안만 갈아 끼운다 — 델타마다 전체를 다시 조립하면 답이 길어질수록 버벅인다 */
let rafHold = null;
function patch(m){
  if (rafHold) return;
  rafHold = requestAnimationFrame(() => {
    rafHold = null;
    const node = nodeOf(m.id)?.querySelector(".b-assistant");
    if (!node){ redraw(); return; }
    node.textContent = ""; node.appendChild(renderBody(m));
    scrollBottom();
  });
}

/** 서버가 준 사진 배열 정규화 — 계약이 어긋난 항목은 버리고 최대 3장 (앱 normalizePhotos) */
function normalizePhotos(v){
  if (!Array.isArray(v)) return undefined;
  const out = v.filter(p => p && typeof p.bucket === "string" && typeof p.path === "string" && Number.isInteger(p.part_id)).slice(0, 3);
  return out.length ? out : undefined;
}

/* ═══════════════════════════════════════════════════════════════════════════
   사진 — 안내 시트 → 고르기 → 전송 전 확인 → identify → [맞아요] → confirm
   ═══════════════════════════════════════════════════════════════════════════ */
function startPhoto(){ if (!identifying) openPhotoGuide(); }

/** 긴 변 1,280px · JPEG q0.8 — 앱과 같은 규격 (서버 상한 장당 5MB·총 12MB) */
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
  const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
  return { image_base64: b64, media_type:"image/jpeg", url: URL.createObjectURL(blob), bytes: blob.size, w, h };
}

let pending = [];
$("#filePick").onchange = async (e) => {
  const files = [...(e.target.files || [])].slice(0, MAX_PHOTOS);
  e.target.value = "";
  if (!files.length) return;
  pending = [];
  for (const f of files){
    try { pending.push(await shrink(f)); }
    catch { toast("사진을 읽지 못했습니다"); }
  }
  if (pending.length) openPhotoConfirm();
};

async function sendPending(){
  closeSheet();
  const shots = pending; pending = [];
  if (!shots.length) return;
  for (const s of shots) addMsg({ role:"user", kind:"image", imageUrl: s.url });
  const prog = addMsg({ role:"assistant", kind:"progress", text:"사진을 확인하고 있어요… 카탈로그와 대조 중", elapsed:true });
  identifying = true; setSendState();

  const body = { device_id: deviceId, images: shots.map(s => ({ image_base64: s.image_base64, media_type: s.media_type })) };
  if (sessionId != null) body.session_id = sessionId;
  log("req", `identify ← 사진 ${shots.length}장 (${shots.map(s => `${s.w}×${s.h} ${(s.bytes/1024|0)}KB`).join(", ")})`);
  const t0 = performance.now();
  try {
    const r = await callFn("identify", body);
    msgs.splice(msgs.indexOf(prog), 1);
    log("done", `identify stage=${r.stage} 후보 ${r.candidates?.length ?? 0}개 ident=${r.identification_id} · ${Math.round(performance.now()-t0)}ms`);
    const cands = (r.candidates ?? []).map(c => ({ ...c, thumb: c.match_photo ? publicUrl(c.match_photo.bucket, c.match_photo.path) : null }));
    if (cands.length) addMsg({ role:"assistant", kind:"candidates", candidates: cands, raw: r });
    if (r.need_more){
      addMsg({ role:"assistant", kind:"ask", text: r.need_more.ask,
               labelHint: r.need_more.label_visible === false ? labelHintFor(r.need_more.category) : null });
    }
    // 앱과 같게 — 식별 직후 **다음 텍스트 턴 한 번에만** identification_id를 싣는다
    if (Number.isInteger(r.identification_id)) lastIdent = r.identification_id;
    redraw();
  } catch (e){
    msgs.splice(msgs.indexOf(prog), 1);
    log("error", "identify 실패 — " + e.message);
    addMsg({ role:"assistant", kind:"error", text:"사진을 확인하지 못했습니다. 다시 시도해 주세요.", suggestCall:true });
  }
  identifying = false; setSendState();
}

/** 명판 위치 안내 — 라벨을 못 본 사진의 되묻기에만 붙는다 (앱 labelHintFor).
 *  라벨을 읽은 경로 Top-1 83% vs 외형 경로 18% — 라벨로 이끄는 것이 정확도의 가장 큰 레버다. */
function labelHintFor(category){
  const map = {
    "압축기":"명판은 보통 압축기 몸통 옆면이나 단자함 뚜껑에 붙어 있습니다.",
    "밸브":"밸브는 몸통에 각인되어 있거나 코일 옆면에 스티커가 붙어 있습니다.",
    "코일":"코일 옆면 스티커에 전압·모델명이 적혀 있습니다.",
  };
  for (const k of Object.keys(map)) if (category && String(category).includes(k)) return map[k];
  return "명판(라벨)은 보통 제품 옆면이나 배선 덮개 근처에 붙어 있습니다.";
}

async function confirmCandidate(m, c, btn){
  btn.disabled = true; btn.textContent = "…";
  const identId = m.raw?.identification_id;
  log("req", `confirm ← ident=${identId} part=${c.part_id} variant=${c.variant_id}`);
  try {
    const r = await callFn("confirm", {
      device_id: deviceId, identification_id: identId, part_id: c.part_id,
      ...(Number.isInteger(c.variant_id) ? { variant_id: c.variant_id } : {}),
    });
    log("done", `confirm ok — corpus_image_id=${r.corpus_image_id} (verified=false 격리 편입)`);
    addMsg({ role:"assistant", kind:"confirmed", confirmed: c });
    if (Number.isInteger(identId)) lastIdent = identId;
  } catch (e){
    log("error", "confirm 실패 — " + e.message);
    toast("확인 처리에 실패했습니다");
    btn.disabled = false; btn.textContent = "맞아요";
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   시트 — PhotoGuideSheet · PhotoConfirmSheet · CallHoursSheet
   ═══════════════════════════════════════════════════════════════════════════ */
function openSheet(build){
  const s = $("#sheet"); s.textContent = "";
  const box = el("div", "sheet-box"); build(box);
  s.appendChild(box); s.classList.add("on");
  s.onclick = (e) => { if (e.target === s) closeSheet(); };
}
function closeSheet(){ $("#sheet").classList.remove("on"); }

function openPhotoGuide(){
  openSheet((box) => {
    box.appendChild(el("h2", null, "사진으로 부품 찾기"));
    box.appendChild(el("p", null, "명판(라벨)이 화면에 꽉 차게 찍어 주세요. 멀리서 전체만 찍으면 모델을 특정하지 못합니다."));
    const row = el("div", "sheet-row");
    const cam = el("button", "btn-fill", "카메라로 촬영");
    cam.onclick = () => { closeSheet(); $("#filePick").setAttribute("capture", "environment"); $("#filePick").click(); };
    const lib = el("button", "btn-outline", "앨범에서 선택");
    lib.onclick = () => { closeSheet(); $("#filePick").removeAttribute("capture"); $("#filePick").click(); };
    row.append(cam, lib); box.appendChild(row);
  });
}

function openPhotoConfirm(){
  openSheet((box) => {
    box.appendChild(el("h2", null, "명판 글자가 읽히나요?"));
    const img = el("img", "prev"); img.src = pending[0].url; img.alt = "보낼 사진";
    box.appendChild(img);
    if (pending.length > 1) box.appendChild(el("p", null, `사진 ${pending.length}장을 함께 보냅니다.`));
    const row = el("div", "sheet-row");
    const re = el("button", "btn-outline", "다시 선택"); re.onclick = () => { pending = []; closeSheet(); startPhoto(); };
    const go = el("button", "btn-fill", "이대로 보내기"); go.onclick = sendPending;
    row.append(re, go); box.appendChild(row);
  });
}

function openCallSheet(){
  openSheet((box) => {
    box.appendChild(el("h2", null, "전화 상담 요청"));
    box.appendChild(el("p", null, "상담 가능 시간은 평일 09:00~18:00입니다. 요청을 남기시면 담당자가 확인 후 연락드립니다."));
    const row = el("div", "sheet-row");
    const close = el("button", "btn-outline", "닫기"); close.onclick = closeSheet;
    const go = el("button", "btn-fill", "전화 요청하기");
    go.onclick = () => { closeSheet(); appOnly("전화 요청 폼 /callback"); };
    row.append(close, go); box.appendChild(row);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   입력바 · 헤더
   ═══════════════════════════════════════════════════════════════════════════ */
/** 안내 문구를 한 줄에 맞춘다 — 앱은 adjustsFontSizeToFit minimumFontScale 0.7로 글꼴만 줄인다.
 *  말줄임으로 끝내면 좁은 기기에서 문구가 잘려 무슨 말인지 안 보인다. */
function fitPlaceholder(){
  const ph = $("#ph");
  for (let px = 16; px >= 11; px--){
    ph.style.fontSize = px + "px";
    if (ph.scrollWidth <= ph.clientWidth) break;
  }
}
window.addEventListener("resize", fitPlaceholder);

function grow(){
  const t = $("#input");
  t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px";
  $("#ph").classList.toggle("off", !!t.value);
  if (!t.value) fitPlaceholder();
  setSendState();
}
function setSendState(){
  $("#send").disabled = sending || !$("#input").value.trim();
  $("#btnCam").disabled = identifying;
}
$("#input").oninput = grow;
$("#input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendText(); } };
$("#send").onclick = () => sendText();
$("#btnCam").onclick = startPhoto;
$("#hNew").onclick = () => newChat();
$("#hHistory").onclick = () => appOnly("상담 기록 서랍");
$("#hCall").onclick = openCallSheet;

function newChat(){
  if (ctrl) ctrl.abort();
  sessionId = null; msgs.length = 0; lastIdent = null; cartVariantIds = new Set();
  $("#stSession").textContent = "—";
  redraw(); log("req", "새 상담 — 다음 턴은 session_id 없이 나갑니다");
}

/* 음성 입력 — 앱은 지원 기기에서만 마이크를 보여준다. 여기서도 브라우저가 되면 보인다. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR){
  const rec = new SR(); rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = false;
  let listening = false;
  $("#btnMic").hidden = false;
  $("#btnMic").onclick = () => { if (listening) rec.stop(); else { try { rec.start(); } catch { /* 이미 시작됨 */ } } };
  rec.onstart  = () => { listening = true;  $("#btnMic").classList.add("rec");    $("#ph").textContent = "듣고 있어요 — 말씀해 주세요"; fitPlaceholder(); };
  rec.onend    = () => { listening = false; $("#btnMic").classList.remove("rec"); $("#ph").textContent = "모델명이나 궁금한 점을 입력하세요"; fitPlaceholder(); };
  rec.onresult = (e) => { $("#input").value = [...e.results].map(r => r[0].transcript).join(""); grow(); };
}

/* ── 시험용 줄 (앱에 없음) ─────────────────────────────────────────────── */
$("#devNewChat").onclick = () => newChat();
$("#devNewDevice").onclick = () => {
  deviceId = "web-" + uid(); localStorage.setItem(DEV_KEY, deviceId);
  $("#stDevice").textContent = deviceId.slice(4, 12) + "…";
  newChat(); toast("새 손님으로 바꿨습니다");
};
$("#devRaw").onclick = () => $("#raw").classList.toggle("on");
$("#rawClear").onclick = () => { $("#rawBody").textContent = ""; };
$("#rawCopy").onclick = () => navigator.clipboard.writeText($("#rawBody").innerText).then(() => toast("복사했습니다"), () => toast("복사가 막혔습니다"));
$("#rawMeta").onclick = async () => {
  try {
    const r = await callFn("chat-history", { device_id: deviceId, ...(sessionId != null ? { session_id: sessionId } : {}), limit: 4 });
    const last = (r.messages ?? []).filter(m => m.role === "assistant").slice(-1)[0];
    log("done", last ? `저장된 정본 meta (message ${last.id})\n` + JSON.stringify(last.meta, null, 1) : "저장된 답변이 없습니다");
  } catch (e){ log("error", "chat-history 실패 — " + e.message); }
};
$("#fnSel").onchange = () => {
  const v = $("#fnSel").value;
  if (v === "__custom"){
    const name = (prompt("스테이징 함수 이름 (docs/41: chat-dev-<이름>)", fnName.startsWith("chat-dev-") ? fnName : "chat-dev-") || "").trim();
    if (!/^chat(-dev-[a-z0-9-]+)?$/i.test(name)){ $("#fnSel").value = fnName; toast("이름은 chat 또는 chat-dev-<이름>"); return; }
    fnName = name;
    if (!$(`#fnSel option[value="${fnName}"]`)){
      const o = el("option", null, fnName + " (스테이징)"); o.value = fnName;
      $("#fnSel").insertBefore(o, $("#fnSel").lastElementChild);
    }
  } else fnName = v;
  $("#fnSel").value = fnName; localStorage.setItem(FN_KEY, fnName);
  newChat(); log("req", "대상 함수 = " + fnName);
};

/* ═══════════════════════════════════════════════════════════════════════════
   문 열기
   ═══════════════════════════════════════════════════════════════════════════ */
async function boot(pw){
  await unlock(pw);
  sessionStorage.setItem(PW_KEY, pw);
  $("#gate").style.display = "none";
  $("#desk").classList.add("on");

  $("#greet").textContent = GREETING;
  const chips = $("#chips");
  for (const c of CHIPS){
    const b = el("button", "chip", c.label);
    b.onclick = () => {
      if (c.act === "photo") startPhoto();
      else if (c.act === "callsheet") openCallSheet();
      else if (c.act === "nav") appOnly(c.to);
      else { $("#input").value = c.text; $("#input").focus(); grow(); }
    };
    chips.appendChild(b);
  }

  if (fnName !== "chat"){
    const o = el("option", null, fnName + " (스테이징)"); o.value = fnName;
    $("#fnSel").insertBefore(o, $("#fnSel").lastElementChild);
  }
  $("#fnSel").value = fnName;
  $("#stDevice").textContent = deviceId.slice(4, 12) + "…";
  log("req", `준비됨 — 대상 ${fnName} · 기기 ${deviceId}`);
  fitPlaceholder(); setSendState();
}

$("#gateForm").onsubmit = async (e) => {
  e.preventDefault();
  $("#gateErr").textContent = "여는 중…";
  try { await boot($("#gatePw").value); }
  catch { $("#gateErr").textContent = "비밀번호가 다릅니다."; $("#gatePw").select(); }
};
// 같은 탭에서 새로고침하면 다시 묻지 않는다 (창을 닫으면 지워진다)
const cachedPw = sessionStorage.getItem(PW_KEY);
if (cachedPw) boot(cachedPw).catch(() => sessionStorage.removeItem(PW_KEY));
</script>
