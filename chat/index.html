<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A56DB">
<meta name="robots" content="noindex, nofollow">
<title>RChatAI 시험용 앱</title>
<!--
  문 — 앱 웹 빌드(app/) 앞에 세운 페이지.

  ☠️ 이것은 **잠금이 아니라 문턱이다.** 웹 빌드 안에는 앱과 같은 anon 키가 들어 있고,
     그 키는 주소만 알면 자바스크립트 파일에서 꺼낼 수 있다(스토어 APK도 마찬가지다).
     비밀번호는 주소를 우연히 연 사람이 그냥 쓰는 것을 막을 뿐이다.
     진짜 방어선은 ① 이 화면이 부르는 것이 **스테이징 함수**라 안 쓸 때 지워 버릴 수 있다는 점,
     ② 서버의 분당 호출 제한(기기 15회·IP 40회)이다.
-->
<style>
  :root{ --primary600:#1A56DB; --bg:#fff; --bgSubtle:#F5F7FA; --border:#E5E8EE;
         --textPrimary:#111827; --textSecondary:#4B5563; --danger600:#DC2626; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bgSubtle);padding:20px;
       font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
  form{width:100%;max-width:340px;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:24px;display:grid;gap:14px}
  .logo{width:44px;height:44px;border-radius:11px;background:var(--primary600);display:grid;place-items:center;
        color:#fff;font-weight:600;font-size:17px}
  h1{margin:0;font-size:20px;line-height:28px;font-weight:600;color:var(--textPrimary)}
  p{margin:0;font-size:14px;line-height:20px;color:var(--textSecondary)}
  input{min-height:48px;background:var(--bgSubtle);border:1px solid var(--border);border-radius:12px;
        padding:0 16px;font-size:16px;font-family:inherit;color:var(--textPrimary)}
  button{min-height:56px;border:none;border-radius:12px;background:var(--primary600);color:#fff;
         font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .err{color:var(--danger600);font-size:14px;font-weight:600;min-height:20px}
  .note{font-size:12px;line-height:18px;color:var(--textSecondary);border-top:1px solid var(--border);padding-top:12px}
</style>
</head>
<body>
<form id="f">
  <div class="logo">RC</div>
  <h1>RChatAI 시험용 앱</h1>
  <p>실제 앱을 그대로 웹으로 띄운 것입니다. 상담(채팅)은 <b>시험용 서버</b>에 연결됩니다.</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button type="submit">열기</button>
  <div class="err" id="err"></div>
  <div class="note">여기서 만든 주문·장바구니·상담 기록은 실제 데이터베이스에 남습니다. 손님에게 나가는 앱과는 별개입니다.</div>
</form>
<script>
  // 비밀번호는 글자 그대로 두지 않는다 — 소스를 봐도 바로 안 보이게 해시로만 비교한다.
  // (위 주석대로 이것은 문턱이지 잠금이 아니다.)
  const WANT = "a8d51e9f3373191251a83f30a7438dd08d921d0b78bd5cfe8dae4737d2b14410";
  const KEY = "rchatai.appweb.ok";
  const go = () => { location.replace("app/"); };
  if (sessionStorage.getItem(KEY) === WANT) go();
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    if (hex !== WANT) { document.getElementById("err").textContent = "비밀번호가 다릅니다."; document.getElementById("pw").select(); return; }
    sessionStorage.setItem(KEY, WANT);
    go();
  };
</script>
</body>
</html>
