<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>댄포스 부품 데이터 현황</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#16191d; --dim:#6b7280;
    --ok:#15803d; --okbg:#dcfce7; --no:#b91c1c; --nobg:#fee2e2;
    --warn:#a16207; --warnbg:#fef3c7; --blue:#1d4ed8; --bluebg:#dbeafe;
    --violet:#6d28d9; --violetbg:#ede9fe;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
  button{font-family:inherit}

  /* ── 비밀번호 화면 ─────────────────────────── */
  #gate{max-width:380px;margin:14vh auto 0;padding:0 18px;text-align:center}
  #gate .logo{font-size:34px;margin-bottom:10px}
  #gate h1{font-size:19px;margin:0 0 6px}
  #gate p{color:var(--dim);font-size:13.5px;margin:0 0 18px}
  #gate input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:11px;background:#fff}
  #gate .pwshow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12.5px;color:var(--dim);margin:10px 0 14px;cursor:pointer}
  #gate button.go{width:100%;padding:13px;font-size:15.5px;font-weight:700;color:#fff;background:var(--ink);border:0;border-radius:11px;cursor:pointer}
  #gate .msg{margin-top:14px;font-size:13.5px;color:var(--no);min-height:20px}
  #gate .msg.load{color:var(--dim)}
  #gate .prog{height:6px;background:#eceff3;border-radius:99px;overflow:hidden;margin-top:10px;display:none}
  #gate .prog>i{display:block;height:100%;background:var(--blue);width:0;transition:width .15s}

  /* ── 머리 ──────────────────────────────────── */
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px 8px}
  .htop{display:flex;gap:10px;align-items:center;max-width:1200px;margin:0 auto}
  h1.site{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modes{display:flex;gap:4px}
  .modes button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hsub{display:flex;gap:8px;align-items:center;max-width:1200px;margin:7px auto 0}
  .hsub input{flex:1;min-width:0;padding:8px 12px;font-size:14px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
  .hsub .meta{font-size:11.5px;color:var(--dim);white-space:nowrap}
  .hsub button{border:0;background:none;color:var(--dim);font-size:11.5px;cursor:pointer;text-decoration:underline;white-space:nowrap;padding:0}

  main{max-width:1200px;margin:0 auto;padding:14px 14px 80px}

  /* ── 공용 조각 ─────────────────────────────── */
  .tag{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-block}
  .t-ok{background:var(--okbg);color:var(--ok)} .t-no{background:var(--nobg);color:var(--no)}
  .t-warn{background:var(--warnbg);color:var(--warn)} .t-blue{background:var(--bluebg);color:var(--blue)}
  .t-gray{background:#e5e7eb;color:#374151} .t-vio{background:var(--violetbg);color:var(--violet)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--blue)}

  /* ── 현황판 ────────────────────────────────── */
  .heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:14px}
  .hero{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .hero .k{font-size:12px;color:var(--dim)}
  .hero .v{font-size:21px;font-weight:800;margin-top:2px}
  .hero .s{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
  .hero.bad .v{color:var(--no)}
  .sechd2{font-size:15px;font-weight:800;margin:20px 2px 8px}
  .tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  table.stat{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
  table.stat th{background:#fafbfc;font-size:11.5px;color:var(--dim);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.stat th:first-child{text-align:left}
  table.stat td{padding:7px 10px;border-bottom:1px solid #f0f2f4;text-align:right;white-space:nowrap}
  table.stat td:first-child{text-align:left;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  table.stat tr:last-child td{border-bottom:0}
  table.stat tr.clk{cursor:pointer} table.stat tr.clk:hover td{background:#f8fafc}
  table.stat td .pct{font-size:11px;color:var(--dim);margin-left:3px}
  .low{color:var(--no);font-weight:700} .mid{color:var(--warn);font-weight:700}
  .holes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .hole{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .hole h3{margin:0 0 4px;font-size:13.5px}
  .hole .n{font-size:19px;font-weight:800}
  .hole .n.bad{color:var(--no)}
  .hole p{margin:4px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
  .hole details{margin-top:7px;font-size:12.5px}
  .hole summary{cursor:pointer;color:var(--blue)}
  .hole li{margin:3px 0}
  .kcard{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;margin-top:10px}
  .kcard:hover{background:#fafbfc}
  .kcard .t{font-weight:700;font-size:13.5px}
  .kcard .d{font-size:12px;color:var(--dim)}

  /* ── 부품별 보기 ───────────────────────────── */
  .fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .fbar select{padding:8px 10px;font-size:13.5px;border:1px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
  .fbar label.tgl{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .fbar .cnt2{font-size:12.5px;color:var(--dim);margin-left:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .pcard:hover{border-color:#c9ced6}
  .pcard .im{aspect-ratio:1.15;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f0f2f4;position:relative}
  .pcard .im img{max-width:92%;max-height:92%;object-fit:contain}
  .pcard .im .noimg{color:#c3c8d0;font-size:12px}
  .pcard .bd{padding:9px 11px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pcard .nm{font-size:13px;font-weight:700;line-height:1.35;word-break:break-word}
  .pcard .ct2{font-size:11px;color:var(--dim)}
  .pcard .ln{font-size:11.5px;color:var(--dim)}
  .pcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .pcard .tag{font-size:10.5px;padding:1.5px 7px}

  /* ── 상세 오버레이 ─────────────────────────── */
  .ovl{position:fixed;inset:0;background:rgba(22,25,29,.45);z-index:40;overflow-y:auto;overscroll-behavior:contain}
  .sheet{max-width:1000px;margin:24px auto;background:#fff;border-radius:16px;min-height:60vh;overflow:hidden}
  @media(max-width:640px){ .sheet{margin:0;border-radius:0;min-height:100vh} }
  .shd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;gap:10px;align-items:flex-start;z-index:5}
  .shd .tt{flex:1;min-width:0}
  .shd h2{margin:0;font-size:17px;line-height:1.35;word-break:break-word}
  .shd .sub{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5;word-break:break-word}
  .x{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
  .sbody{padding:14px 16px 60px}
  .blk{margin-bottom:22px}
  .blk>h3{font-size:13.5px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
  .blk>h3 .c{font-size:11.5px;color:var(--dim);font-weight:400}
  .attr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
  .attr .row{background:#fafbfc;border:1px solid #f0f2f4;border-radius:8px;padding:6px 10px;font-size:12.5px}
  .attr .row b{display:block;font-size:11px;color:var(--dim);font-weight:600}
  .ptabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
  .ptabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer}
  .ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}
  .pics .pi{position:relative}
  .pics img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}
  .pics .pk{position:absolute;left:5px;top:5px;font-size:9.5px;padding:1px 6px;border-radius:99px;font-weight:700}
  .capnote{font-size:11.5px;color:var(--dim);margin-top:6px}
  .doclist{display:flex;flex-direction:column;gap:6px}
  .docrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
  .docrow .ic{font-size:17px}
  .docrow .t3{flex:1;min-width:0}
  .docrow .t3 .n2{font-weight:600;word-break:break-word;line-height:1.35}
  .docrow .t3 .s2{font-size:11.5px;color:var(--dim)}
  .docrow a.open{flex:none;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-decoration:none}

  /* 모델(변형) 목록 */
  .vfil{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .vfil input{flex:1;min-width:140px;padding:7px 11px;font-size:13.5px;border:1px solid var(--line);border-radius:9px}
  .vfil .c3{font-size:12px;color:var(--dim);white-space:nowrap}
  .vrows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .vrow{border-bottom:1px solid #f0f2f4}
  .vrow:last-child{border-bottom:0}
  .vhead{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
  .vhead:hover{background:#fafbfc}
  .vhead .mn{font-weight:700;font-size:13.5px;word-break:break-all}
  .vhead .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{font-size:10.5px;background:#f1f3f6;border-radius:99px;padding:1.5px 7px;color:#374151;white-space:nowrap}
  .vhead .sp2{flex:1}
  .vhead .pr{font-size:13px;font-weight:700;white-space:nowrap}
  .vhead .pr small{font-weight:400;color:var(--dim);font-size:10.5px}
  .vhead .pr .nop{color:var(--no);font-size:12px;font-weight:600}
  .vbody{display:none;background:#fafbfc;border-top:1px dashed var(--line);padding:12px 14px}
  .vrow.open .vbody{display:block}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
  .vsec h4{margin:0 0 6px;font-size:12px;color:var(--dim)}
  table.mini{border-collapse:collapse;font-size:12.5px;width:100%}
  table.mini td{padding:4px 8px;border-bottom:1px solid #eef0f3;vertical-align:top}
  table.mini td:first-child{color:var(--dim);white-space:nowrap;width:36%}
  table.mini td:last-child{text-align:right;word-break:break-word}
  table.mini tr:last-child td{border-bottom:0}
  .spectxt{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
  .dplinks{display:flex;flex-direction:column;gap:4px;font-size:12.5px;overflow-wrap:anywhere}
  .dplinks a{text-decoration:none}
  .dplinks .hh{color:var(--dim);font-size:11px}
  #expBar{max-width:1200px;margin:10px auto -4px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600}
  #expBar.bad{background:var(--nobg);color:var(--no)} #expBar.warn{background:var(--warnbg);color:var(--warn)}
  .morev{width:100%;border:0;background:#fafbfc;border-top:1px solid var(--line);padding:11px;font-size:13px;color:var(--blue);cursor:pointer}

  /* ── 565 보기 ──────────────────────────────── */
  .fsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .sechd{padding:11px 13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer}
  .sechd h2{margin:0;font-size:14.5px;flex:1 1 200px;min-width:0}
  .sechd .cnt{font-size:12px;color:var(--dim);white-space:nowrap}
  .secbd{display:none;border-top:1px solid var(--line)}
  .sec.open .secbd{display:block}
  .fitem{display:flex;gap:10px;align-items:center;padding:8px 13px;border-bottom:1px solid #f0f2f4;font-size:13px;flex-wrap:wrap}
  .fitem:last-child{border-bottom:0}
  .fitem .cd{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .fitem .md{font-weight:700;word-break:break-all}
  .fitem .nt{color:var(--dim);font-size:12px}
  .fitem .sp2{flex:1}
  .fitem .pr2{font-size:12.5px;white-space:nowrap}
  .fitem button.go2{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;white-space:nowrap}

  /* ── 라이트박스 ────────────────────────────── */
  #lb{position:fixed;inset:0;background:rgba(10,12,14,.93);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  #lb img{max-width:96vw;max-height:84vh;object-fit:contain;background:#fff;border-radius:8px}
  #lb .nav2{display:flex;gap:14px;align-items:center;color:#cbd5e1;font-size:13px}
  #lb .nav2 button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:15px;cursor:pointer}

  /* 지식 문서 오버레이 */
  .mdbody{padding:14px 16px 60px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- ── 1. 비밀번호 ── -->
<div id="gate">
  <div class="logo">🧊</div>
  <h1>댄포스 부품 데이터 현황</h1>
  <p>우리가 모은 댄포스 데이터 전부(가격·사양·사진·문서)를 한 곳에서 봅니다.<br>비밀번호를 넣으면 열립니다. 열리면 이 기기에 열쇠가 저장돼 다음부터 바로 열립니다.</p>
  <input id="pwInput" type="password" autocomplete="current-password" placeholder="비밀번호">
  <label class="pwshow"><input type="checkbox" id="pwShow"> 비밀번호 보이기</label>
  <button class="go" id="pwGo">열기</button>
  <div class="msg" id="gateMsg"></div>
  <div class="prog" id="gateProg"><i></i></div>
</div>

<!-- ── 2. 본 화면 ── -->
<div id="app" hidden>
  <header>
    <div class="htop">
      <h1 class="site">🧊 댄포스 부품 데이터 현황</h1>
      <nav class="modes">
        <button data-v="dash" class="on">현황판</button>
        <button data-v="parts">부품별</button>
        <button data-v="freq">자주 팔리는 565</button>
      </nav>
    </div>
    <div class="hsub">
      <input id="q" placeholder="이름 · 모델명 · 품번 검색  (예: TE5, 067B, 사이트글라스)">
      <span class="meta" id="builtAt"></span>
      <button id="relock">비밀번호 다시 넣기</button>
    </div>
  </header>
  <div id="expBar" hidden></div>
  <main id="vDash"></main>
  <main id="vParts" hidden>
    <div class="fbar">
      <select id="fCat"></select>
      <select id="fSort">
        <option value="name">이름순</option>
        <option value="vars">모델 많은 순</option>
        <option value="photos">사진 많은 순</option>
        <option value="docs">문서 많은 순</option>
        <option value="holes">빠진 것 많은 순</option>
      </select>
      <label class="tgl"><input type="checkbox" id="fFreq"> 자주 팔리는 565에 든 것만</label>
      <span class="cnt2" id="fCnt"></span>
    </div>
    <div class="cards" id="cards"></div>
  </main>
  <main id="vFreq" hidden></main>
</div>

<div id="ovl" class="ovl" hidden></div>
<div id="kovl" class="ovl" hidden></div>
<div id="lb" hidden>
  <img id="lbImg" alt="">
  <div class="nav2">
    <button id="lbPrev">◀</button>
    <span id="lbCnt"></span>
    <button id="lbNext">▶</button>
    <button id="lbX">닫기</button>
  </div>
</div>

<script>
"use strict";
/* ═════════ 0. 공용 ═════════ */
const $ = (s, el) => (el ?? document).querySelector(s);
const $$ = (s, el) => [...(el ?? document).querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => n == null ? "—" : Number(n).toLocaleString("ko-KR");
const won = (n) => n == null ? "—" : Number(n).toLocaleString("ko-KR") + "원";
const pctS = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
const pctCls = (a, b) => { if (!b) return ""; const p = a / b; return p < .5 ? "low" : p < .85 ? "mid" : ""; };
const DOCICON = { catalog: "📗", manual: "📘", datasheet: "📄", drawing: "📐", certificate: "📜", pricelist: "💰", etc: "📎" };
const DOCNAME = { catalog: "카탈로그", manual: "매뉴얼", datasheet: "데이터시트", drawing: "도면", certificate: "인증서", pricelist: "가격표", etc: "기타 자료" };
const KIND = { field: ["현장", "t-ok"], mfr: ["제조사", "t-blue"], draw: ["도면", "t-gray"], det: ["상세", "t-vio"] };
const BASIS = { consumer_list: "소비자가", unknown: "출처 불명" };
const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);

let D = null;                 // 복호화된 데이터
let partById = new Map(), docById = new Map(), catName = new Map();
let stats = null;             // 부품별 계산치

/* ═════════ 1. 비밀번호 → 복호화 ═════════ */
/* 비밀번호 원문은 어디에도 저장하지 않는다 — 성공하면 PBKDF2 유도키(이 파일 전용)만
   localStorage에 남긴다. 같은 origin의 다른 도구가 읽어도 비밀번호 재사용 피해가 없다. */
const gate = $("#gate"), gateMsg = $("#gateMsg"), gateProg = $("#gateProg");
const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
const unhex = (s) => new Uint8Array((s.match(/../g) ?? []).map((x) => parseInt(x, 16)));
const PBKDF2_ITERS = 600000;
const featureOK = () => typeof DecompressionStream !== "undefined" && !!(crypto && crypto.subtle);
$("#pwShow").onchange = (e) => { $("#pwInput").type = e.target.checked ? "text" : "password"; };

async function fetchBin() {
  const r = await fetch("data.bin?v=msy9o4a0");
  if (!r.ok) throw new Error("데이터 파일을 못 받았습니다 (HTTP " + r.status + ")");
  const total = +r.headers.get("content-length") || 0;
  if (!r.body || !total) return new Uint8Array(await r.arrayBuffer());
  const reader = r.body.getReader(); const chunks = []; let got = 0;
  gateProg.style.display = "block";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    gateProg.firstElementChild.style.width = Math.round(got / total * 90) + "%";
  }
  const out = new Uint8Array(got); let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}
let binCache = null, gcmFails = 0;
async function unlock({ pw, keyHex, save }) {
  let ok = false;
  try {
    gateMsg.className = "msg load"; gateMsg.textContent = "데이터 받는 중…";
    binCache ??= await fetchBin();
    const bin = binCache;
    if (new TextDecoder().decode(bin.slice(0, 5)) !== "DFCS1") throw new Error("데이터 형식이 다릅니다");
    gateMsg.textContent = "여는 중…";
    const salt = bin.slice(5, 21), iv = bin.slice(21, 33), cipher = bin.slice(33);
    let key;
    if (keyHex != null) {
      key = await crypto.subtle.importKey("raw", unhex(keyHex), "AES-GCM", false, ["decrypt"]);
    } else {
      const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: PBKDF2_ITERS, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }
    let gz;
    try { gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher); }
    catch {
      if (keyHex != null) {   // 저장된 열쇠가 새 데이터와 안 맞음(재빌드) — 지우고 비밀번호를 다시 받는다
        localStorage.removeItem("dfcs_k");
        gateMsg.className = "msg"; gateMsg.textContent = "데이터가 새로 구워졌습니다. 비밀번호를 다시 넣어 주세요.";
      } else {
        gcmFails++;
        if (gcmFails >= 3) { binCache = null; gcmFails = 0; }   // 파일 손상 가능성 — 다음 시도 때 다시 받는다
        gateMsg.className = "msg"; gateMsg.textContent = "비밀번호가 맞지 않습니다. 다시 확인해 주세요.";
      }
      gateProg.style.display = "none";
      return;
    }
    gateProg.firstElementChild.style.width = "96%";
    const ds = new DecompressionStream("gzip");
    D = JSON.parse(await new Response(new Response(gz).body.pipeThrough(ds)).text());
    if (save) { try { localStorage.setItem("dfcs_k", hex(await crypto.subtle.exportKey("raw", key))); } catch {} }
    ok = true;
  } catch (e) {
    gateMsg.className = "msg";
    gateMsg.textContent = "열지 못했습니다: " + e.message;
    gateProg.style.display = "none";
  }
  if (ok) boot();
}

/* ═════════ 2. 계산 ═════════ */
function compute() {
  partById = new Map(D.parts.map((p) => [p.id, p]));
  docById = new Map(D.docs.map((d) => [d.id, d]));
  catName = new Map(D.cats.map((c) => [c.id, c.nm]));
  const freqPids = new Set(D.freq.map((f) => f.pid).filter((x) => x != null));
  stats = new Map();
  for (const p of D.parts) {
    const vs = p.vs;
    p._hay = (p.nm + " " + (p.ser ?? "") + " " + (p.sc ?? "")).toLowerCase();
    for (const v of vs) v._hay = (String(v.m ?? "") + " " + (v.oc ?? "") + " " + (v.nko ?? "")).toLowerCase();
    const s = {
      vn: vs.length,
      priceN: vs.filter((v) => v.p != null).length,
      costN: vs.filter((v) => v.c != null).length,
      specN: vs.filter((v) => v.st || v.tx || v.ir).length,
      // docVN = 등록 문서(열 수 있는 것)와 이어진 모델. 파일 스템만 매칭된 모델은 따로 센다.
      docVN: vs.filter((v) => v.dp.some((e) => e[0] != null)).length,
      stemOnlyVN: vs.filter((v) => v.dp.length && !v.dp.some((e) => e[0] != null)).length,
      conflictN: vs.filter((v) => v.cf).length,
      disN: vs.filter((v) => v.dc === 1).length,        // 진짜 단종 문구
      unavN: vs.filter((v) => v.dc === 2).length,       // KR 스토어 비판매(단종 아닐 수 있음)
      docIds: new Set(),
      phF: p.pht.field, phM: p.pht.mfr, phD: p.pht.draw, det: p.dn,
      inFreq: freqPids.has(p.id),
    };
    for (const v of vs) for (const [d] of v.dp) if (d != null) s.docIds.add(d);
    s.phTotal = s.phF + s.phM + s.phD + s.det;
    s.holes = (s.phF + s.phM === 0 ? 1 : 0) + (s.priceN === 0 && s.vn > 0 ? 1 : 0) + (s.docIds.size === 0 ? 1 : 0) + (s.specN === 0 && s.vn > 0 ? 1 : 0);
    stats.set(p.id, s);
  }
}

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function expiryCheck() {
  // 문서 링크는 5년짜리 서명 URL이다 — 만료가 다가오면 화면에서 미리 알린다
  try {
    const d = D.docs.find((x) => x.u);
    if (!d) return;
    const tok = new URL(d.u).searchParams.get("token");
    const exp = JSON.parse(atob(tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp * 1000;
    const left = exp - Date.now();
    const bar = $("#expBar");
    if (left <= 0) {
      bar.hidden = false; bar.className = "bad";
      bar.textContent = "⚠ 문서(PDF) 링크가 만료되었습니다. 새로 구워 올려야 문서가 열립니다 — node build.mjs && node deploy.mjs";
    } else if (left < 1000 * 60 * 60 * 24 * 30) {
      bar.hidden = false; bar.className = "warn";
      bar.textContent = `⚠ 문서(PDF) 링크가 ${Math.ceil(left / 864e5)}일 뒤 만료됩니다. 그 전에 새로 구워 올리세요.`;
    }
  } catch {}
}

function partThumb(p) {
  const pick = p.ph.find((x) => x.k === "field") ?? p.ph.find((x) => x.k === "mfr") ?? p.ph[0];
  return pick?.u ?? p.di[0] ?? null;

function renderParts() {

    if (cat !== "" && String(p.cat ?? 0) !== cat && !p.ali) return false;
    if (cat !== "" && p.ali) return false;
    const s = stats.get(p.id);
    if (freqOnly && !s.inFreq) return false;
    if (q && !p._hay.includes(q) && !p.vs.some((v) => v._hay.includes(q))) return false;
    return true;
  });

    vars: (a, b) => S(b).vn - S(a).vn,
    photos: (a, b) => S(b).phTotal - S(a).phTotal,
    docs: (a, b) => S(b).docIds.size - S(a).docIds.size,
    holes: (a, b) => S(b).holes - S(a).holes,
  };
  list.sort(sorters[sort]);
  $("#fCnt").textContent = `${num(list.length)}개 제품 · 모델 ${num(list.reduce((a, p) => a + S(p).vn, 0))}개`;
  $("#cards").innerHTML = list.map((p) => {
    const s = S(p);
    const th = partThumb(p);
    const tags = [];
    if (p.ali) tags.push(`<span class="tag t-vio">알옥션 등록</span>`);
    if (s.phF + s.phM + s.phD + s.det === 0) tags.push(`<span class="tag t-no">사진 없음</span>`);
    else if (s.phF === 0) tags.push(`<span class="tag t-warn">현장사진 없음</span>`);
    if (s.vn && s.priceN === 0) tags.push(`<span class="tag t-no">가격 없음</span>`);
    if (s.docIds.size === 0) tags.push(`<span class="tag t-warn">문서 없음</span>`);
    if (s.disN) tags.push(`<span class="tag t-gray">단종 ${s.disN}</span>`);
    if (s.unavN) tags.push(`<span class="tag t-gray">KR비판매 ${s.unavN}</span>`);
    return `<div class="pcard" data-part="${p.id}">
      <div class="im">${th ? `<img loading="lazy" src="${esc(th)}" alt="">` : `<span class="noimg">사진 없음</span>`}</div>
      <div class="bd">
        <div class="nm">${esc(p.nm)}</div>
        <div class="ct2">${esc(catName.get(p.cat) ?? "")}</div>
        <div class="ln num">모델 ${num(s.vn)} · 사진 ${num(s.phTotal)} · 문서 ${num(s.docIds.size)}</div>
        <div class="tags">${tags.join("")}</div>
      </div></div>`;
  }).join("") || `<p style="color:var(--dim)">조건에 맞는 제품이 없습니다.</p>`;
  $$("#cards .pcard").forEach((c) => c.onclick = () => openPart(+c.dataset.part));
}

/* ═════════ 6. 부품 상세 ═════════ */
/* 오버레이·사진 확대는 뒤로가기로도 닫힌다 — 폰에서 습관적으로 뒤로가기를 눌러도
   사이트를 벗어나지 않게 history에 한 칸씩 쌓고, popstate에서 맨 위 것만 닫는다. */
const ovStack = [];
function ovOpen(id) { $("#" + id).hidden = false; ovStack.push(id); history.pushState({ ov: ovStack.length }, ""); }
function ovCloseTop() { if (ovStack.length) history.back(); }
window.addEventListener("popstate", () => { const id = ovStack.pop(); if (id) $("#" + id).hidden = true; });

let lbList = [], lbIdx = 0;
function openLB(list, i) {
  lbList = list; lbIdx = i;
  ovOpen("lb"); drawLB();
}
function drawLB() {
  $("#lbImg").src = lbList[lbIdx];
  $("#lbCnt").textContent = (lbIdx + 1) + " / " + lbList.length;
}
$("#lbPrev").onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; drawLB(); };
$("#lbNext").onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbList.length; drawLB(); };
$("#lbX").onclick = () => ovCloseTop();
$("#lb").onclick = (e) => { if (e.target.id === "lb") ovCloseTop(); };
document.addEventListener("keydown", (e) => {
  if (!$("#lb").hidden) {
    if (e.key === "ArrowLeft") $("#lbPrev").click();
    else if (e.key === "ArrowRight") $("#lbNext").click();
    else if (e.key === "Escape") ovCloseTop();
  } else if (e.key === "Escape") ovCloseTop();
});

const VPAGE = 80;
function openPart(pid) {
  const p = partById.get(pid);
  if (!p) return;
  const s = stats.get(pid);
  const ovl = $("#ovl");
  const allPhotos = [...p.ph.map((x) => ({ ...x })), ...p.di.map((u) => ({ u, k: "det" }))];
  const phCnt = { all: allPhotos.length, field: p.ph.filter((x) => x.k === "field").length, mfr: p.ph.filter((x) => x.k === "mfr").length, draw: p.ph.filter((x) => x.k === "draw").length, det: p.di.length };
  const capped = (s.phF > 40 ? 1 : 0) + (s.phM > 30 ? 1 : 0) + (s.phD > 12 ? 1 : 0) + (p.dn > 20 ? 1 : 0);

  const docRows = [...s.docIds].map((id) => docById.get(id)).filter(Boolean)
    .map((d) => {
      const pages = new Set();
      for (const v of p.vs) for (const [di, pg] of v.dp) if (di === d.id) pages.add(pg);
      return { d, pages: [...pages].sort((a, b) => a - b) };
    }).sort((a, b) => (a.d.ty === b.d.ty ? 0 : a.d.ty < b.d.ty ? -1 : 1));
  // 문서 등록 없이 파일 스템으로만 매칭된 것 — 열 수는 없지만 "매칭이 있다"는 사실은 보여준다
  const stemSet = new Set();
  for (const v of p.vs) for (const e of v.dp) if (e[0] == null && e[3]) stemSet.add(e[3]);

  ovl.innerHTML = `<div class="sheet">
    <div class="shd"><div class="tt">
      <h2>${esc(p.nm)} ${p.ali ? '<span class="tag t-vio">알옥션 등록</span>' : ""}</h2>
      <div class="sub">${esc(catName.get(p.cat) ?? "")}${p.ser ? " · 시리즈 " + esc(p.ser) : ""}${p.sc ? "<br>댄포스 분류: " + esc(p.sc) : ""}</div>
    </div><button class="x" id="ovlX">✕</button></div>
    <div class="sbody">
      ${p.desc ? `<div class="blk"><div class="spectxt">${esc(p.desc)}</div></div>` : ""}
      ${p.at && Object.keys(p.at).length ? `<div class="blk"><h3>제품 속성</h3><div class="attr">` +
        Object.entries(p.at).map(([k, v]) => `<div class="row"><b>${esc(k)}</b>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</div>`).join("") + `</div></div>` : ""}
      <div class="blk"><h3>사진 <span class="c num">현장 ${s.phF} · 제조사 ${s.phM} · 도면 ${s.phD} · 상세 ${p.dn}</span></h3>
        <div class="ptabs" id="phTabs">
          <button data-k="all" class="on">전체 ${phCnt.all}</button>
          <button data-k="field">현장 ${phCnt.field}</button>
          <button data-k="mfr">제조사 ${phCnt.mfr}</button>
          <button data-k="draw">도면 ${phCnt.draw}</button>
          <button data-k="det">상세 ${phCnt.det}</button>
        </div>
        <div class="pics" id="phGrid"></div>
        ${capped ? `<div class="capnote">화면이 무거워지지 않게 종류별 상한(현장 40 · 제조사 30 · 도면 12 · 상세 20)까지만 실었습니다. 위 숫자가 실제 장수입니다.</div>` : ""}
      </div>
      <div class="blk"><h3>문서 <span class="c num">${docRows.length}건</span></h3>
        ${docRows.length ? `<div class="doclist">` + docRows.map(({ d, pages }) => `
          <div class="docrow"><div class="ic">${DOCICON[d.ty] ?? "📎"}</div>
            <div class="t3"><div class="n2">${esc(d.t)}</div>
              <div class="s2">${esc(DOCNAME[d.ty] ?? d.ty)} · ${d.pc ?? "?"}쪽${d.kb ? " · " + num(d.kb) + "KB" : ""}${pages.length ? " · 이 제품 관련 " + pages.slice(0, 12).map((x) => "p." + x).join(" ") + (pages.length > 12 ? " …" : "") : ""}</div></div>
            ${d.u ? `<a class="open" href="${esc(d.u)}" target="_blank" rel="noopener">열기</a>` : ""}
          </div>`).join("") + `</div>` : `<p style="color:var(--dim);font-size:13px">이 제품에 이어진 문서가 없습니다.</p>`}
        ${stemSet.size ? `<div class="capnote">이 밖에 문서 등록 없이 <b>파일 이름으로만</b> 매칭된 자료 ${stemSet.size}종이 있습니다 (모델을 펼치면 보입니다 — 열리지는 않습니다).</div>` : ""}
      </div>
      <div class="blk"><h3>모델(품번)별 사양·가격 <span class="c num">${num(p.vs.length)}모델 · 판매가 ${s.priceN} · 소비자가 ${s.costN}</span></h3>
        <div class="vfil"><input id="vq" placeholder="모델명·품번으로 거르기"><span class="c3 num" id="vcnt"></span></div>
        <div class="vrows" id="vrows"></div>
      </div>
    </div></div>`;
  ovOpen("ovl");
  ovl.scrollTop = 0;
  $("#ovlX").onclick = () => ovCloseTop();
  ovl.onclick = (e) => { if (e.target === ovl) ovCloseTop(); };

  /* 사진 */
  let curK = "all";
  function drawPh() {
    const list = allPhotos.filter((x) => curK === "all" || x.k === curK);
    $("#phGrid").innerHTML = list.map((x, i) => `<div class="pi"><img loading="lazy" src="${esc(x.u)}" data-i="${i}" alt="">
      <span class="pk ${KIND[x.k][1]}">${KIND[x.k][0]}${x.c ? "·검색중" : ""}</span></div>`).join("")
      || `<p style="color:var(--dim);font-size:13px">이 계통 사진이 없습니다.</p>`;
    $$("#phGrid img").forEach((im) => im.onclick = () => openLB(list.map((x) => x.u), +im.dataset.i));
  }
  $$("#phTabs button").forEach((b) => b.onclick = () => {
    curK = b.dataset.k;
    $$("#phTabs button").forEach((x) => x.classList.toggle("on", x === b));
    drawPh();
  });
  drawPh();

  /* 모델 목록 */
  let shown = VPAGE;
  const sortedVs = p.vs.slice().sort((a, b) => String(a.m).localeCompare(String(b.m), "en", { numeric: true }));
  function vRow(v) {
    const chips = [];
    if (v.hp != null) chips.push(esc(v.hp) + "HP");
    if (v.rf) chips.push(esc(v.rf));
    if (v.tc) chips.push(esc(v.tc));
    if (v.cs) chips.push(esc(v.cs));
    if (v.ct) chips.push(esc(v.ct));
    return `<div class="vrow" data-vid="${v.id}"><div class="vhead">
      <span class="mn">${esc(v.m)}</span>
      <span class="chips">${chips.map((c) => `<span class="chip">${c}</span>`).join("")}${v.dp.length ? `<span class="chip">📄${v.dp.length}</span>` : ""}${v.dc === 1 ? `<span class="tag t-gray">단종</span>` : v.dc === 2 ? `<span class="tag t-gray">KR스토어 비판매</span>` : ""}${v.cf ? `<span class="tag t-warn">가격충돌</span>` : ""}</span>
      <span class="sp2"></span>
      <span class="pr num">${v.p != null ? won(v.p) + ` <small>판매가</small>` : `<span class="nop">가격 없음</span>`}</span>
    </div><div class="vbody"></div></div>`;
  }
  function vBody(v) {
    const priceRows = v.p != null ? D.grades.map((g) =>
      `<tr><td>${esc(g.nm)} (할인 ${Math.round(g.r * 100)}%)</td><td class="num">${won(gradePrice(v.p, g.r))}</td></tr>`).join("") : "";
    const idRows = [
      ["모델명", esc(v.m)], v.nko ? ["이름(한글)", esc(v.nko)] : null, v.nen ? ["이름(영문)", esc(v.nen)] : null,
      v.oc ? ["쇼핑몰 품번", esc(v.oc)] : null, v.sp ? ["시리즈", esc(v.sp)] : null,
      v.moq != null ? ["최소 주문(MOQ)", esc(v.moq)] : null,
      v.pn ? ["스토어 안내문", esc(v.pn)] : null,
      safeUrl(v.url) ? ["댄포스 스토어", `<a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener">제품 페이지 열기</a>`] : null,
    ].filter(Boolean);
    const dpLinks = v.dp.map(([di, pg, hh, stem]) => {
      const d = di != null ? docById.get(di) : null;
      const label = d ? esc(d.t) : esc(stem || "(문서 미등록)") + ' <span class="hh">파일만 있음</span>';
      const body = d?.u ? `<a href="${esc(d.u)}#page=${pg}" target="_blank" rel="noopener">${esc(d.t)} — p.${pg}</a>` : `${label} — p.${pg}`;
      return `<div>${DOCICON[d?.ty] ?? "📎"} ${body}${hh ? `<span class="hh"> · ${esc(hh)}</span>` : ""}</div>`;
    }).join("");
    return `<div class="vgrid">
      <div class="vsec"><h4>식별</h4><table class="mini">${idRows.map(([k, x]) => `<tr><td>${k}</td><td>${x}</td></tr>`).join("")}</table></div>
      <div class="vsec"><h4>가격</h4><table class="mini">
        ${v.c != null ? `<tr><td>가격표 단가${v.cb ? ` <span class="hh">(${esc(BASIS[v.cb] ?? v.cb)})</span>` : ""}</td><td class="num">${won(v.c)}</td></tr>` : ""}
        ${v.p != null ? `<tr><td><b>판매가 (일반가)</b></td><td class="num"><b>${won(v.p)}</b></td></tr>` + priceRows : `<tr><td>판매가</td><td>없음</td></tr>`}
        ${v.cn ? `<tr><td>가격 메모</td><td>${esc(v.cn)}</td></tr>` : ""}
        ${v.ps ? `<tr><td>가격 출처</td><td>${esc(v.ps)}</td></tr>` : ""}
      </table></div>
      ${v.st && Object.keys(v.st).length ? `<div class="vsec"><h4>스토어 속성 (${Object.keys(v.st).length})</h4><table class="mini">` +
        Object.entries(v.st).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${esc(typeof x === "object" ? JSON.stringify(x) : x)}</td></tr>`).join("") + `</table></div>` : ""}
      ${v.tx || v.ir ? `<div class="vsec"><h4>사양 문구</h4>
        ${v.tx ? `<div class="spectxt">${esc(v.tx)}</div>` : ""}
        ${v.ir ? `<div class="spectxt" style="margin-top:6px"><span class="hh">IR 가격표: </span>${esc(v.ir)}</div>` : ""}</div>` : ""}
      ${v.dp.length ? `<div class="vsec"><h4>문서에서 이 모델이 나오는 곳 (${v.dp.length})</h4><div class="dplinks">${dpLinks}</div></div>` : ""}
    </div>`;
  }
  function drawVs() {
    const q = $("#vq").value.trim().toLowerCase();
    const openIds = new Set($$("#vrows .vrow.open").map((r) => +r.dataset.vid));   // 펼쳐둔 행 유지
    const list = q ? sortedVs.filter((v) => v._hay.includes(q)) : sortedVs;
    $("#vcnt").textContent = num(list.length) + "모델";
    const cut2 = list.slice(0, shown);
    $("#vrows").innerHTML = (cut2.map(vRow).join("") || `<p style="color:var(--dim);font-size:13px;padding:10px 13px;margin:0">거른 조건에 맞는 모델이 없습니다.</p>`) +
      (list.length > shown ? `<button class="morev" id="moreV">더 보기 (${num(list.length - shown)}모델 남음)</button>` : "");
    function expand(row) {
      if (!row.querySelector(".vbody").innerHTML) {
        const v = sortedVs.find((x) => x.id === +row.dataset.vid);
        row.querySelector(".vbody").innerHTML = vBody(v);
      }
      row.classList.add("open");
    }
    $$("#vrows .vrow").forEach((row) => { if (openIds.has(+row.dataset.vid)) expand(row); });
    $$("#vrows .vhead").forEach((hd) => hd.onclick = () => {
      const row = hd.parentElement;
      if (row.classList.contains("open")) row.classList.remove("open");
      else expand(row);
    });
    const mb = $("#moreV");
    if (mb) mb.onclick = () => { shown += VPAGE * 3; drawVs(); };
  }
  $("#vq").addEventListener("input", debounce(() => { shown = VPAGE; drawVs(); }, 150));
  drawVs();
}

/* ═════════ 7. 자주 팔리는 565 ═════════ */
function renderFreq() {
  const secs = new Map();
  for (const f of D.freq) {
    if (!secs.has(f.sec)) secs.set(f.sec, []);
    secs.get(f.sec).push(f);
  }
  const linked = D.freq.filter((f) => f.pid != null).length;
  const dis = D.freq.filter((f) => f.dc).length;
  const sheets = [...new Set(D.freq.map((f) => f.sheet).filter(Boolean))];
  // 같은 모델의 "현행" 가격표 단가(variant_costs) — 시트 시점과 다르면 병기한다
  const costByVid = new Map();
  for (const p of D.parts) for (const v of p.vs) if (v.c != null) costByVid.set(v.id, v.c);
  const isOld = (pb) => { const y = parseInt(pb); return y && y < 2025; };
  let h = `<div class="fsum">
    <span class="tag t-ok num">DB 연결 ${linked}</span>
    <span class="tag t-no num">DB에 없음 ${D.freq.length - linked}</span>
    <span class="tag t-gray num">단종 표시 ${dis}</span>
    <span class="tag t-blue num">소제목 ${secs.size}칸</span>
    <span style="font-size:12px;color:var(--dim);align-self:center">${esc(sheets.join(" · "))} 기준 · 단가는 소비자가 · 시트 시점과 현행 가격표가 다르면 현행값을 병기</span>
  </div>`;
  h += [...secs.entries()].map(([sec, arr]) => {
    const miss = arr.filter((f) => f.pid == null).length;
    const secSheets = [...new Set(arr.map((f) => f.sheet).filter(Boolean))];
    return `<div class="sec"><div class="sechd">
      <h2>${esc(sec)}</h2>
      ${miss ? `<span class="tag t-no">없음 ${miss}</span>` : `<span class="tag t-ok">전부 연결</span>`}
      <span class="cnt num">${arr.length}품목 · ${esc(secSheets.join(" · "))}</span>
    </div><div class="secbd">` + arr.map((f) => {
      const cur = f.vid != null ? costByVid.get(f.vid) : null;
      const diff = cur != null && f.p != null && cur !== f.p;
      return `
      <div class="fitem">
        <span class="cd">${esc(f.code)}</span>
        <span class="md">${esc(f.model)}</span>
        ${f.note ? `<span class="nt">${esc(f.note)}</span>` : ""}
        ${f.dc ? `<span class="tag t-gray">단종</span>` : ""}
        ${isOld(f.pb) ? `<span class="tag t-warn">오래된 단가</span>` : ""}
        <span class="sp2"></span>
        <span class="pr2 num">${f.p != null ? won(f.p) + ` <small style="color:var(--dim)">소비자가 ${esc(f.pb ?? "")}</small>` : ""}${diff ? `<br><span class="tag t-warn num">현행 ${won(cur)}</span>` : ""}</span>
        ${f.pid != null && partById.has(f.pid) ? `<button class="go2" data-part="${f.pid}">제품 보기</button>` : `<span class="tag t-no">DB에 없음</span>`}
      </div>`;
    }).join("") + `</div></div>`;
  }).join("");
  const el = $("#vFreq");
  el.innerHTML = h;
  $$(".sechd", el).forEach((hd) => hd.onclick = () => hd.parentElement.classList.toggle("open"));
  $$("button.go2", el).forEach((b) => b.onclick = (e) => { e.stopPropagation(); openPart(+b.dataset.part); });
}

/* ═════════ 8. 지식 문서 ═════════ */
function openKnow(i) {
  const k = D.know[i];
  const ovl = $("#kovl");
  ovl.innerHTML = `<div class="sheet"><div class="shd"><div class="tt"><h2>🧠 ${esc(k.title)}</h2></div>
    <button class="x" id="kx">✕</button></div><div class="mdbody">${esc(k.md)}</div></div>`;
  ovOpen("kovl");
  $("#kx").onclick = () => ovCloseTop();
  ovl.onclick = (e) => { if (e.target === ovl) ovCloseTop(); };
}
</script>
