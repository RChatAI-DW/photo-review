<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6E7C">
<title>목소리 비교 — RChatAI</title>
<style>
  :root {
    --ground:#E9EDEF; --surface:#FBFCFC; --surface-2:#F1F5F6;
    --ink:#0E1A20; --ink-soft:#55666F; --ink-faint:#8698A0;
    --line:#CBD5D9; --line-soft:#DFE7EA;
    --accent:#0A6E7C; --accent-soft:#D8ECEF;
    --warn:#8A5A00; --warn-soft:#F6EBD2;
    --miss:#B3261E; --miss-soft:#F7DEDC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0D1417; --surface:#141E22; --surface-2:#1A262B;
      --ink:#E6EDEF; --ink-soft:#9BADB4; --ink-faint:#6C818A;
      --line:#27373D; --line-soft:#1F2E33;
      --accent:#4FBAC9; --accent-soft:#16333A;
      --warn:#E0AC4E; --warn-soft:#33290F;
      --miss:#F2867A; --miss-soft:#3A1C19;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    font-size:16px; line-height:1.55; padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap { max-width:820px; margin:0 auto; padding:18px 14px 48px; }

  header { margin-bottom:16px; }
  .eyebrow { font-size:10.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin:0 0 4px; }
  h1 { font-size:23px; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; }
  .lede { font-size:14.5px; color:var(--ink-soft); margin:0; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:14px; margin-bottom:12px; }
  .lbl { font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); display:block; margin-bottom:5px; }
  textarea, select, input[type="text"] {
    font:inherit; font-size:15px; width:100%; padding:10px 11px;
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:4px;
  }
  textarea { min-height:76px; resize:vertical; line-height:1.5; }
  textarea:focus, select:focus, input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .presets { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .presets button {
    font:inherit; font-size:12.5px; font-weight:600; background:transparent; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:3px; padding:6px 10px; cursor:pointer;
  }
  .presets button:hover { border-color:var(--accent); color:var(--accent); }

  .row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:10px; }
  .field { flex:1 1 200px; }
  button.play {
    font:inherit; font-size:15px; font-weight:700; background:var(--accent); color:var(--surface);
    border:1px solid var(--accent); border-radius:4px; padding:12px 20px; cursor:pointer; min-height:46px;
  }
  button.play:disabled { opacity:.4; }
  button.play:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .results { display:grid; gap:8px; }
  .res {
    background:var(--surface); border:1px solid var(--line-soft); border-left:3px solid var(--line);
    border-radius:4px; padding:12px 14px; display:grid; gap:6px;
  }
  .res.tc { border-left-color:var(--accent); }
  .res.oa { border-left-color:var(--warn); }
  .res .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .res .who { font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
  .res.tc .who { color:var(--accent); }
  .res.oa .who { color:var(--warn); }
  .res .nm { font-weight:700; font-size:15px; }
  .res .ms {
    margin-left:auto; font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;
    font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink-soft);
  }
  .res .ms b { color:var(--ink); font-size:15px; }
  .res audio { width:100%; height:38px; }
  .res .say { font-size:13.5px; color:var(--ink-soft); word-break:break-word; }
  .res.err { border-left-color:var(--miss); }
  .res.err .say { color:var(--miss); }

  .tips { margin-top:14px; background:var(--surface); border:1px solid var(--line-soft); border-left:3px solid var(--accent); border-radius:4px; padding:13px 16px; font-size:14px; color:var(--ink-soft); }
  .tips b { color:var(--ink); }
  .tips ul { margin:8px 0 0; padding-left:19px; }
  .tips li { margin-bottom:5px; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">국내 TTS vs OpenAI</p>
    <h1>목소리 비교</h1>
    <p class="lede">같은 문장을 두 엔진으로 읽혀 나란히 듣습니다. <b>품번과 금액을 어떻게 읽는지</b>가 핵심입니다.</p>
  </header>

  <div class="card">
    <label class="lbl" for="text">읽을 문장</label>
    <textarea id="text">060G3631, 131,670원입니다. 재고는 입고 문의가 필요합니다.</textarea>
    <div class="presets" id="presets"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label class="lbl" for="tcv">타입캐스트 목소리</label>
        <select id="tcv"><option>불러오는 중…</option></select>
      </div>
      <div class="field">
        <label class="lbl" for="oav">OpenAI 목소리</label>
        <select id="oav">
          <option value="marin">marin (지금 쓰는 것)</option>
          <option value="coral">coral</option>
          <option value="sage">sage</option>
          <option value="shimmer">shimmer</option>
          <option value="cedar">cedar</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button class="play" id="go">둘 다 들어보기</button>
      <button class="play" id="goTc" style="background:transparent;color:var(--accent)">타입캐스트만</button>
    </div>
  </div>

  <div class="results" id="results"></div>

  <div class="tips">
    <b>들으실 때 이것만 보십시오</b>
    <ul>
      <li><b>품번</b> — <code>060G3631</code>을 또박또박 읽는가, 뭉개거나 다르게 읽는가</li>
      <li><b>금액</b> — <code>131,670원</code>을 한 덩이로 읽는가, 쉼표에서 끊는가</li>
      <li><b>억양</b> — 한국인 상담원처럼 들리는가, 외국인이 한국어 하는 느낌인가</li>
      <li><b>첫 소리까지</b> — 오른쪽 숫자. 대화에서는 이게 곧 답답함입니다</li>
    </ul>
  </div>

</div>

<script>
(function () {
  "use strict";
  var API = "https://wjlzfknaezwwyusdrdtt.supabase.co/functions/v1/voice";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbHpma25hZXp3d3l1c2RyZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjAwODEsImV4cCI6MjEwMTM5NjA4MX0.q8g2wFBP_ideMcGgtgKeFwwxBdIG7ajpcv6RJxJbO9s";

  var PRESETS = [
    ["가격+재고", "060G3631, 131,670원입니다. 재고는 입고 문의가 필요합니다."],
    ["변별쌍",   "7755007과 7755017은 다른 제품입니다. 어느 쪽을 찾으십니까?"],
    ["영문 품번", "비쳐 HSN5343-20은 가격문의 품목입니다. 확인 후 안내드리겠습니다."],
    ["긴 품번",  "EVR-10S 032L1214, 그리고 TGEL 3.5 067N3150 둘 다 있습니다."],
    ["일반 상담", "저온용 팽창밸브는 증발 온도와 냉매를 알아야 골라 드릴 수 있습니다."],
    ["전화 요청", "전화 요청 남겨 드릴까요? 담당자가 확인하고 연락드립니다."]
  ];

  function $(id){ return document.getElementById(id); }

  var pv = $("presets");
  PRESETS.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = p[0];
    b.addEventListener("click", function () { $("text").value = p[1]; });
    pv.appendChild(b);
  });

  // 목소리 목록
  fetch(API + "?r=voices", { method: "POST", headers: { apikey: ANON } })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var sel = $("tcv");
      sel.innerHTML = "";
      if (!j.ok) { sel.innerHTML = "<option>불러오지 못했습니다</option>"; return; }
      j.voices.forEach(function (v) {
        var o = document.createElement("option");
        o.value = v.id; o.textContent = v.name;
        sel.appendChild(o);
      });
      // 한국어 상담원에 어울릴 만한 기본값
      var want = ["Seohyeon", "Daeun", "Hyoeun", "Moonjung"];
      for (var i = 0; i < want.length; i++) {
        var hit = Array.prototype.find.call(sel.options, function (o) { return o.textContent === want[i]; });
        if (hit) { sel.value = hit.value; break; }
      }
    })
    .catch(function () { $("tcv").innerHTML = "<option>불러오지 못했습니다</option>"; });

  function card(kind, who, name) {
    var d = document.createElement("div");
    d.className = "res " + kind;
    var top = document.createElement("div"); top.className = "top";
    var w = document.createElement("span"); w.className = "who"; w.textContent = who;
    var n = document.createElement("span"); n.className = "nm"; n.textContent = name;
    var ms = document.createElement("span"); ms.className = "ms"; ms.textContent = "합성 중…";
    top.appendChild(w); top.appendChild(n); top.appendChild(ms);
    d.appendChild(top);
    d._ms = ms;
    $("results").insertBefore(d, $("results").firstChild);
    return d;
  }

  async function speak(engine, voice, name, text) {
    var kind = engine === "openai" ? "oa" : "tc";
    var who = engine === "openai" ? "OpenAI" : "타입캐스트";
    var d = card(kind, who, name);
    var t0 = performance.now();
    try {
      var res = await fetch(API + "?r=tts&engine=" + engine + "&voice=" + encodeURIComponent(voice), {
        method: "POST",
        headers: { apikey: ANON, "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      });
      if (!res.ok || !res.body) {
        var e = await res.text();
        d.className = "res err";
        d._ms.textContent = "";
        var p = document.createElement("div"); p.className = "say"; p.textContent = "실패 (" + res.status + ") " + e.slice(0, 160);
        d.appendChild(p);
        return;
      }
      var reader = res.body.getReader(), chunks = [], first = null, total = 0;
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        if (first === null) first = Math.round(performance.now() - t0);
        chunks.push(r.value); total += r.value.length;
      }
      var type = res.headers.get("content-type") || "audio/wav";
      var blob = new Blob(chunks, { type: type });
      d._ms.innerHTML = "첫 소리 <b>" + first + "</b>ms · 전체 " + Math.round(performance.now() - t0) + "ms";
      var a = document.createElement("audio");
      a.controls = true; a.autoplay = false;
      a.src = URL.createObjectURL(blob);
      d.appendChild(a);
      var s = document.createElement("div"); s.className = "say"; s.textContent = text;
      d.appendChild(s);
      try { await a.play(); } catch (e) { /* 자동재생 차단 — 버튼으로 재생 */ }
    } catch (e) {
      d.className = "res err"; d._ms.textContent = "";
      var q = document.createElement("div"); q.className = "say"; q.textContent = "실패: " + (e && e.message ? e.message : String(e));
      d.appendChild(q);
    }
  }

  function tcName() {
    var s = $("tcv");
    return s.options[s.selectedIndex] ? s.options[s.selectedIndex].textContent : "?";
  }

  $("go").addEventListener("click", async function () {
    var t = $("text").value.trim(); if (!t) return;
    this.disabled = true; $("goTc").disabled = true;
    await speak("typecast", $("tcv").value, tcName(), t);
    await speak("openai", $("oav").value, $("oav").value, t);
    this.disabled = false; $("goTc").disabled = false;
  });

  $("goTc").addEventListener("click", async function () {
    var t = $("text").value.trim(); if (!t) return;
    this.disabled = true; $("go").disabled = true;
    await speak("typecast", $("tcv").value, tcName(), t);
    this.disabled = false; $("go").disabled = false;
  });
})();
</script>
</body>
</html>
