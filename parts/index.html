<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>댄포스 자주 팔리는 부품 — 카테고리별 사진 확인</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#16191d; --dim:#6b7280;
    --ok:#15803d; --okbg:#dcfce7; --no:#b91c1c; --nobg:#fee2e2;
    --warn:#a16207; --warnbg:#fef3c7; --blue:#1d4ed8; --bluebg:#dbeafe;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
  h1{margin:0 0 2px;font-size:17px}
  .sub{color:var(--dim);font-size:12.5px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.dim{color:var(--dim)}
  .prog{height:6px;background:#eceff3;border-radius:99px;overflow:hidden;margin-top:9px}
  .prog>i{display:block;height:100%;background:var(--ok);width:0}
  main{padding:12px 14px 80px;max-width:1100px;margin:0 auto}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .sec.done{opacity:.55}
  .sechd{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer}
  .sechd h2{margin:0;font-size:15.5px;flex:1 1 240px;min-width:0}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
  .t-ok{background:var(--okbg);color:var(--ok)} .t-thin{background:var(--warnbg);color:var(--warn)}
  .t-mfr{background:var(--bluebg);color:var(--blue)} .t-none{background:var(--nobg);color:var(--no)}
  .t-nodb{background:#e5e7eb;color:#374151}
  .cnt{font-size:12px;color:var(--dim);white-space:nowrap}
  .body{padding:11px 13px 14px;display:none}
  .sec.open .body{display:block}
  .part{border-top:1px dashed var(--line);padding:10px 0 4px}
  .part:first-child{border-top:0;padding-top:2px}
  .pname{font-size:13.5px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .pmeta{font-weight:400;color:var(--dim);font-size:11.5px}
  .strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
  figure{margin:0;position:relative;flex:0 0 auto}
  figure img{width:104px;height:104px;object-fit:contain;background:#fff;border:2px solid var(--line);border-radius:9px;display:block;cursor:pointer}
  figure.y img{border-color:var(--ok);background:#f0fdf4}
  figure.n img{border-color:var(--no);background:#fef2f2}
  figure .k{position:absolute;left:3px;bottom:8px;font-size:10px;padding:1px 5px;border-radius:5px;background:#111c;color:#fff}
  figure.mfr .k{background:#1d4ed8cc} figure.draw .k{background:#6b7280cc} figure.field .k{background:#15803dcc}
  figure .z{position:absolute;right:3px;top:3px;background:#111c;color:#fff;border:0;border-radius:6px;font-size:11px;padding:2px 5px;cursor:pointer}
  .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;pointer-events:none}
  figure.y .mark{color:#15803d} figure.n .mark{color:#b91c1c}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  button.act{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  button.act.on{background:var(--ok);border-color:var(--ok);color:#fff}
  button.act.warn.on{background:var(--warn);border-color:var(--warn)}
  button.act.no.on{background:var(--no);border-color:var(--no)}
  .cand{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
  .cand h3{margin:0 0 3px;font-size:13px}
  .why{font-size:11.5px;color:var(--dim);margin:0 0 6px}
  .items{margin-top:9px;font-size:12px;color:#374151}
  .items details summary{cursor:pointer;color:var(--dim);font-size:12px}
  .items table{border-collapse:collapse;margin-top:6px;width:100%}
  .items td{border-top:1px solid var(--line);padding:3px 6px;vertical-align:top}
  .items td.c{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .none{color:var(--no);font-weight:600}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:20}
  footer .g{flex:1;font-size:12px;color:var(--dim)}
  #lb{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}
  #lb.on{display:flex}
  #lb img{max-width:94vw;max-height:74vh;object-fit:contain;background:#fff;border-radius:8px}
  #lb .lbtn{display:flex;gap:8px}
  #lb button{border:0;border-radius:9px;padding:10px 16px;font-size:15px;cursor:pointer}
  #lb .cap{color:#fff;font-size:13px}
  .help{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
  .help>b{display:block;margin-bottom:3px}
  .help ul{margin:4px 0 0;padding-left:18px} .help li{margin:2px 0}
</style>
</head>
<body>
<header>
  <h1>댄포스 자주 팔리는 부품 — 카테고리별 사진 확인</h1>
  <div class="sub" id="sub">불러오는 중…</div>
  <div class="bar" id="filters"></div>
  <div class="prog"><i id="pbar"></i></div>
</header>

<main>
  <div class="help" id="help">
    <b>보시는 법</b>
    <ul>
      <li><b>사진을 누르면</b> 초록 ✓(맞음) ↔ 빨강 ✕(딴 물건)으로 바뀝니다. 잘못 눌렀으면 한 번 더.</li>
      <li>딱지 색: <span style="color:#15803d;font-weight:600">초록=손님 계통 사진</span>(알옥션·웹) ·
          <span style="color:#1d4ed8;font-weight:600">파랑=제조사 스튜디오</span> ·
          회색=3D 도면. <b>초록이 있어야 검색이 맞기 시작합니다.</b></li>
      <li>칸마다 <b>[이 칸 사진 다 맞음]</b> 또는 <b>[촬영 필요]</b>를 눌러 주세요.</li>
      <li>맨 아래 <b>[판정 내보내기]</b>를 눌러 나온 파일을 저에게 주시면 됩니다. 중간에 닫으셔도 기록은 남습니다.</li>
    </ul>
  </div>
  <div id="list"></div>
</main>

<footer>
  <div class="g" id="gauge"></div>
  <button class="act" id="expall">전부 펼치기</button>
  <button class="act" id="save">판정 내보내기</button>
</footer>

<div id="lb">
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
  <div class="lbtn">
    <button style="background:#15803d;color:#fff" data-v="y">맞음 (1)</button>
    <button style="background:#b91c1c;color:#fff" data-v="n">딴 물건 (2)</button>
    <button style="background:#fff" data-v="x">닫기 (Esc)</button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.DATA, KEY = "danfoss-parts-review-v1";
  var V = { photo:{}, sec:{}, cand:{} };
  try { var s = localStorage.getItem(KEY); if (s) V = Object.assign(V, JSON.parse(s)); } catch(e){}
  var saveT; function save(){ clearTimeout(saveT); saveT = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(V)); } catch(e){}
  }, 200); }

  var STATE = {
    ok:{label:"사진 있음", cls:"t-ok"}, thin:{label:"사진 1~2장", cls:"t-thin"},
    mfr:{label:"제조사 사진만", cls:"t-mfr"}, none:{label:"사진 없음", cls:"t-none"},
    nodb:{label:"DB에 물건 없음", cls:"t-nodb"}
  };
  var F = { state:"all", draw:false, todo:false };

  var filters = document.getElementById("filters");
  function mkchip(txt, on, fn, dim){
    var b = document.createElement("button");
    b.className = "chip" + (on?" on":"") + (dim?" dim":""); b.textContent = txt;
    b.onclick = fn; filters.appendChild(b); return b;
  }
  function cntState(st){ return D.sections.filter(function(s){return s.state===st}).length }
  function drawFilters(){
    filters.innerHTML = "";
    mkchip("전체 "+D.sections.length, F.state==="all", function(){ F.state="all"; render(); });
    ["nodb","none","mfr","thin","ok"].forEach(function(st){
      var n = cntState(st); if (!n) return;
      mkchip(STATE[st].label+" "+n, F.state===st, function(){ F.state=st; render(); });
    });
    mkchip(F.todo?"아직 안 본 칸만 ✓":"아직 안 본 칸만", F.todo, function(){ F.todo=!F.todo; render(); }, true);
    mkchip(F.draw?"3D 도면 보임 ✓":"3D 도면 보기", F.draw, function(){ F.draw=!F.draw; render(); }, true);
  }

  function secDone(sec){ return !!V.sec[sec.sec] }
  function visible(){
    return D.sections.filter(function(s){
      if (F.state!=="all" && s.state!==F.state) return false;
      if (F.todo && secDone(s)) return false;
      return true;
    });
  }

  function photoEl(ph, title){
    var f = document.createElement("figure");
    f.className = ph.k + (V.photo[ph.i]==="y"?" y":V.photo[ph.i]==="n"?" n":"");
    var img = document.createElement("img");
    img.src = ph.u; img.loading = "lazy"; img.alt = title;
    img.onerror = function(){ f.style.display="none"; };
    img.onclick = function(){
      var cur = V.photo[ph.i];
      V.photo[ph.i] = cur==="y" ? "n" : cur==="n" ? "" : "y";
      if (!V.photo[ph.i]) delete V.photo[ph.i];
      f.className = ph.k + (V.photo[ph.i]==="y"?" y":V.photo[ph.i]==="n"?" n":"");
      mark.textContent = V.photo[ph.i]==="y"?"✓":V.photo[ph.i]==="n"?"✕":"";
      save(); gauge();
    };
    var k = document.createElement("span"); k.className="k";
    k.textContent = ph.k==="field" ? (ph.c?"현장·검색중":"현장") : ph.k==="mfr" ? "제조사" : "도면";
    var z = document.createElement("button"); z.className="z"; z.textContent="⤢";
    z.onclick = function(e){ e.stopPropagation(); openLb(ph, title, f, mark); };
    var mark = document.createElement("span"); mark.className="mark";
    mark.textContent = V.photo[ph.i]==="y"?"✓":V.photo[ph.i]==="n"?"✕":"";
    f.appendChild(img); f.appendChild(k); f.appendChild(z); f.appendChild(mark);
    return f;
  }

  function strip(photos, title){
    var d = document.createElement("div"); d.className="strip";
    var shown = photos.filter(function(p){ return F.draw || p.k!=="draw" });
    if (!shown.length){ var e=document.createElement("div"); e.className="empty";
      e.textContent = photos.length ? "3D 도면만 있습니다 (위 ‘3D 도면 보기’를 켜면 보입니다)" : "사진 없음";
      d.appendChild(e); return d; }
    shown.forEach(function(p){ d.appendChild(photoEl(p, title)); });
    return d;
  }

  function actBtn(label, key, kind){
    var b = document.createElement("button");
    b.className = "act" + (kind?" "+kind:"") + (V.sec[key.s]===key.v ? " on":"");
    b.textContent = label;
    b.onclick = function(){
      V.sec[key.s] = (V.sec[key.s]===key.v) ? "" : key.v;
      if (!V.sec[key.s]) delete V.sec[key.s];
      render(); gauge(); save();
    };
    return b;
  }

  function render(){
    drawFilters();
    var list = document.getElementById("list"); list.innerHTML = "";
    var rows = visible();
    if (!rows.length){ list.innerHTML = '<div class="empty">해당하는 칸이 없습니다.</div>'; gauge(); return; }
    rows.forEach(function(sec){
      var el = document.createElement("section");
      el.className = "sec" + (secDone(sec)?" done":"") + (sec.__open?" open":"");
      var hd = document.createElement("div"); hd.className="sechd";
      var h2 = document.createElement("h2"); h2.textContent = sec.sec;
      var tag = document.createElement("span"); tag.className="tag "+STATE[sec.state].cls; tag.textContent=STATE[sec.state].label;
      var cnt = document.createElement("span"); cnt.className="cnt";
      cnt.textContent = "품목 "+sec.n+(sec.linked<sec.n?" (DB연결 "+sec.linked+")":"")
        + " · 현장 "+sec.tot.field+" 제조사 "+sec.tot.mfr+" 도면 "+sec.tot.draw;
      hd.appendChild(h2); hd.appendChild(tag); hd.appendChild(cnt);
      hd.onclick = function(){ sec.__open = !sec.__open; render(); };
      el.appendChild(hd);

      var body = document.createElement("div"); body.className="body";

      if (!sec.parts.length){
        var e = document.createElement("div"); e.className="empty none";
        e.textContent = sec.linked===0
          ? "이 칸의 품목은 DB에 등록된 제품이 없습니다 — 사진 이전에 제품 수집이 필요합니다."
          : "연결된 제품에 사진이 없습니다.";
        body.appendChild(e);
      }
      sec.parts.forEach(function(p){
        var d = document.createElement("div"); d.className="part";
        var t = document.createElement("div"); t.className="pname";
        t.innerHTML = '<span>'+esc(p.name)+'</span><span class="pmeta">'+esc(p.brand)
          +(p.cat?" · "+esc(p.cat):"")+" · 사진 "+p.total.field+"/"+p.total.mfr+"/"+p.total.draw+"</span>";
        d.appendChild(t); d.appendChild(strip(p.photos, p.name));
        body.appendChild(d);
      });

      if (sec.cands && sec.cands.length){
        sec.cands.forEach(function(c){
          var box = document.createElement("div"); box.className="cand";
          var h3 = document.createElement("h3"); h3.textContent = "❓ 같은 물건인가요? — " + c.name;
          var why = document.createElement("p"); why.className="why";
          why.textContent = "알옥션(자사몰)에 따로 등록된 제품입니다. 같은 물건이면 이 사진들을 위 칸에 끌어다 쓸 수 있습니다."
            + (c.why? "  기계가 짝지은 근거: "+c.why : "");
          box.appendChild(h3); box.appendChild(why);
          box.appendChild(strip(c.photos, c.name));
          var bs = document.createElement("div"); bs.className="btns";
          var key = sec.sec+"|"+c.pid;
          [["같은 물건 맞음","y",""],["아님 — 딴 물건","n","no"]].forEach(function(o){
            var b = document.createElement("button");
            b.className = "act "+o[2]+(V.cand[key]===o[1]?" on":"");
            b.textContent = o[0];
            b.onclick = function(){
              V.cand[key] = V.cand[key]===o[1] ? "" : o[1];
              if(!V.cand[key]) delete V.cand[key];
              render(); gauge(); save();
            };
            bs.appendChild(b);
          });
          box.appendChild(bs);
          body.appendChild(box);
        });
      }

      var bs = document.createElement("div"); bs.className="btns";
      bs.appendChild(actBtn("이 칸 사진 다 맞음", {s:sec.sec, v:"ok"}));
      bs.appendChild(actBtn("사진 부족 — 촬영 필요", {s:sec.sec, v:"shoot"}, "warn"));
      bs.appendChild(actBtn("딴 물건이 섞임", {s:sec.sec, v:"bad"}, "no"));
      body.appendChild(bs);

      var it = document.createElement("div"); it.className="items";
      var det = document.createElement("details");
      var sm = document.createElement("summary"); sm.textContent = "이 칸의 품목 "+sec.n+"개 보기";
      det.appendChild(sm);
      var tb = document.createElement("table");
      sec.items.forEach(function(i){
        var tr = document.createElement("tr");
        tr.innerHTML = '<td class="c">'+esc(i.code)+'</td><td>'+esc(i.model)
          + (i.note? ' <span class="pmeta">'+esc(i.note)+'</span>':'')
          + (i.pid==null? ' <span class="none">· DB에 없음</span>':'') + '</td>';
        tb.appendChild(tr);
      });
      det.appendChild(tb); it.appendChild(det); body.appendChild(it);

      el.appendChild(body); list.appendChild(el);
    });
    gauge();
  }

  function gauge(){
    var done = D.sections.filter(secDone).length;
    var pc = Math.round(done / D.sections.length * 100);
    document.getElementById("pbar").style.width = pc + "%";
    var np = Object.keys(V.photo).length, nc = Object.keys(V.cand).length;
    document.getElementById("gauge").textContent =
      "칸 " + done + "/" + D.sections.length + " (" + pc + "%) · 사진 판정 " + np + "장 · 짝 판정 " + nc + "건";
  }

  // 크게 보기
  var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lbcap = document.getElementById("lbcap");
  var lbCur = null;
  function openLb(ph, title, fig, mark){
    lbCur = { ph:ph, fig:fig, mark:mark };
    lbimg.src = ph.u; lbcap.textContent = title + " — " + (ph.k==="field"?"손님 계통(알옥션·웹)":ph.k==="mfr"?"제조사 스튜디오":"3D 도면");
    lb.classList.add("on");
  }
  function setLb(v){
    if (!lbCur) return;
    if (v==="x"){ lb.classList.remove("on"); lbCur=null; return; }
    V.photo[lbCur.ph.i] = v; save();
    lbCur.fig.className = lbCur.ph.k + " " + v;
    lbCur.mark.textContent = v==="y"?"✓":"✕";
    gauge(); lb.classList.remove("on"); lbCur=null;
  }
  lb.querySelectorAll("button").forEach(function(b){ b.onclick = function(){ setLb(b.dataset.v); }; });
  lb.onclick = function(e){ if (e.target===lb) setLb("x"); };
  document.onkeydown = function(e){
    if (!lb.classList.contains("on")) return;
    if (e.key==="1") setLb("y"); else if (e.key==="2") setLb("n"); else if (e.key==="Escape") setLb("x");
  };

  document.getElementById("expall").onclick = function(){
    var open = D.sections.some(function(s){ return !s.__open });
    D.sections.forEach(function(s){ s.__open = open; });
    this.textContent = open ? "전부 접기" : "전부 펼치기";
    render();
  };

  document.getElementById("save").onclick = function(){
    var out = { 만든날: new Date().toISOString().slice(0,10), 데이터날짜: D.만든날, 칸판정:{}, 짝판정:{}, 사진판정:{} };
    D.sections.forEach(function(s){ if (V.sec[s.sec]) out.칸판정[s.sec] = ({ok:"사진 다 맞음",shoot:"촬영 필요",bad:"딴 물건 섞임"})[V.sec[s.sec]]; });
    Object.keys(V.cand).forEach(function(k){ out.짝판정[k] = V.cand[k]==="y"?"같은 물건":"딴 물건"; });
    Object.keys(V.photo).forEach(function(k){ out.사진판정[k] = V.photo[k]==="y"?"맞음":"딴 물건"; });
    var blob = new Blob([JSON.stringify(out, null, 1)], { type:"application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "부품검수-" + out.만든날 + ".json";
    a.click(); URL.revokeObjectURL(a.href);
  };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]; }); }

  document.getElementById("sub").textContent =
    "가격표 " + D.칸수 + "칸 · 품목 " + D.품목수 + "개(DB연결 " + D.연결됨 + ") · 자료 " + D.만든날;
  // 주소 끝에 #all 을 붙이면 전부 펼친 채로 열린다 (링크로 바로 보여줄 때 씀)
  if (location.hash === "#all") D.sections.forEach(function(s){ s.__open = true; });
  render();
})();
</script>
</body>
</html>
