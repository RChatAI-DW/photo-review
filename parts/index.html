<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>댄포스 자주 팔리는 부품 — 사진 검수</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#16191d; --dim:#6b7280;
    --ok:#15803d; --okbg:#dcfce7; --no:#b91c1c; --nobg:#fee2e2;
    --warn:#a16207; --warnbg:#fef3c7; --blue:#1d4ed8; --bluebg:#dbeafe;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px}
  .htop{display:flex;gap:10px;align-items:center}
  h1{margin:0;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modes{display:flex;gap:4px}
  .modes button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
  .modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .prog{height:6px;background:#eceff3;border-radius:99px;overflow:hidden;margin-top:8px}
  .prog>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
  .pnum{font-size:12px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}

  /* ── 집중 검수 ───────────────────────────────── */
  .focus{max-width:1000px;margin:0 auto;padding:14px 14px 130px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .qhd{padding:12px 15px;border-bottom:1px solid var(--line)}
  .qkind{font-size:12px;color:var(--dim);margin-bottom:2px}
  .qtitle{font-size:19px;font-weight:700;line-height:1.35}
  .qsub{font-size:12.5px;color:var(--dim);margin-top:4px}
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .side{padding:12px 14px}
  .side+.side{border-left:1px solid var(--line)}
  .slab{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;display:inline-block;margin-bottom:6px}
  .slab.a{background:var(--bluebg);color:var(--blue)}
  .slab.b{background:var(--okbg);color:var(--ok)}
  .sname{font-size:13.5px;font-weight:600;margin-bottom:8px;word-break:break-word}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .pics img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:zoom-in}
  .pics.solo{grid-template-columns:1fr}
  .nopic{color:var(--dim);font-size:13px;padding:22px 0;text-align:center;background:#fafbfc;border:1px dashed var(--line);border-radius:10px}
  .single{padding:12px 14px}
  .ans{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:25}
  .ansin{max-width:1000px;margin:0 auto;display:flex;gap:8px}
  .ansin button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 8px;font-size:15px;font-weight:600;cursor:pointer;line-height:1.3}
  .ansin button small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:2px}
  .ansin button.y{border-color:var(--ok);color:var(--ok)} .ansin button.y.on{background:var(--ok);color:#fff}
  .ansin button.n{border-color:var(--no);color:var(--no)} .ansin button.n.on{background:var(--no);color:#fff}
  .ansin button.w{border-color:var(--warn);color:var(--warn)} .ansin button.w.on{background:var(--warn);color:#fff}
  .ansin button.s{flex:0 0 74px;color:var(--dim)}
  .ansin button.on small{color:#fff9}
  .nav{display:flex;gap:8px;justify-content:space-between;margin-top:11px}
  .nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
  .done{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 18px;text-align:center}
  .done h2{margin:0 0 6px;font-size:18px}
  .done p{color:var(--dim);font-size:13.5px;margin:0 0 14px}
  .big{background:var(--ok);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer}

  /* ── 전체 목록 ───────────────────────────────── */
  main.list{padding:12px 14px 90px;max-width:1100px;margin:0 auto}
  .sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .sechd{padding:11px 13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer}
  .sechd h2{margin:0;font-size:15px;flex:1 1 220px;min-width:0}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
  .t-ok{background:var(--okbg);color:var(--ok)} .t-thin{background:var(--warnbg);color:var(--warn)}
  .t-mfr{background:var(--bluebg);color:var(--blue)} .t-none{background:var(--nobg);color:var(--no)}
  .t-nodb{background:#e5e7eb;color:#374151}
  .cnt{font-size:12px;color:var(--dim);white-space:nowrap}
  .body{padding:0 13px 12px;display:none;border-top:1px solid var(--line)}
  .sec.open .body{display:block}
  .part{padding:9px 0 2px;border-top:1px dashed var(--line)}
  .part:first-child{border-top:0}
  .pname{font-size:13px;font-weight:600;margin:8px 0 6px}
  .pmeta{font-weight:400;color:var(--dim);font-size:11.5px}
  .strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}
  .strip img{width:82px;height:82px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;flex:0 0 auto;cursor:zoom-in}
  .more{flex:0 0 auto;align-self:center;font-size:12px;color:var(--blue);background:none;border:0;cursor:pointer}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .verdict{font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .v-y{background:var(--okbg);color:var(--ok)} .v-n{background:var(--nobg);color:var(--no)} .v-w{background:var(--warnbg);color:var(--warn)}

  #lb{position:fixed;inset:0;background:#000e;z-index:60;display:none;align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lb img{max-width:96vw;max-height:92vh;object-fit:contain;background:#fff;border-radius:8px}
  @media (max-width:700px){
    .cmp{grid-template-columns:1fr}
    .side+.side{border-left:0;border-top:1px solid var(--line)}
    .qtitle{font-size:17px}
    /* 폰에서는 답 버튼 3개가 한 줄에 안 들어간다 — 3개를 한 줄, [건너뜀]은 아래 얇은 줄로 */
    .ansin{flex-wrap:wrap;gap:6px}
    .ansin button{font-size:13.5px;padding:11px 4px;flex:1 1 0;min-width:0}
    .ansin button small{font-size:10.5px}
    .ansin button.s{flex:1 0 100%;padding:7px;font-size:12.5px;font-weight:400}
    .ansin button.s small{display:inline;margin:0 0 0 4px}
    /* 사진은 크게 봐야 갈린다 — 폰에서는 두 칸 */
    .pics{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  }
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1 id="h1">댄포스 부품 사진 검수</h1>
    <div class="modes">
      <button id="mFocus" class="on">한 건씩</button>
      <button id="mList">전체 목록</button>
    </div>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="pnum" id="pnum"></div>
</header>

<div class="focus" id="focus"></div>
<main class="list" id="list" style="display:none"></main>
<div class="ans" id="ans" style="display:none"><div class="ansin" id="ansin"></div></div>
<div id="lb"><img id="lbimg" alt=""></div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.DATA, KEY = "danfoss-parts-review-v2";
  var V = { pair:{}, sec:{}, pos:0 };
  try { var s = localStorage.getItem(KEY); if (s) V = Object.assign(V, JSON.parse(s)); } catch(e){}
  var t; function save(){ clearTimeout(t); t = setTimeout(function(){
    try { localStorage.setItem(KEY, JSON.stringify(V)); } catch(e){}
  }, 150); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]; }); }

  // ── 판정 대기열 ──────────────────────────────────────────────
  // 짝 판정을 먼저 놓는다: 이게 사진을 늘리는 유일하게 값싼 길이고, 답이 "예/아니오" 하나라
  // 눈으로 가장 빨리 끝난다. 칸 확인은 그다음.
  // 순서: ①양쪽 사진이 다 있는 짝(눈으로 바로 갈린다) → ②우리 쪽 사진이 없는 짝(이름으로 판단)
  //       → ③칸 확인. 어려운 것을 앞에 두면 첫 화면에서 막힌다.
  var Q = [], qEasy = [], qHard = [];
  D.sections.forEach(function(s){
    var hasRef = (s.parts||[]).some(function(p){ return p.photos.some(function(x){ return x.k!=="draw" }) });
    (s.cands||[]).forEach(function(c){
      (hasRef ? qEasy : qHard).push({ t:"pair", key:s.sec+"|"+c.pid, sec:s, cand:c, ref:hasRef });
    });
  });
  Q = qEasy.concat(qHard);
  D.sections.forEach(function(s){ Q.push({ t:"sec", key:s.sec, sec:s }); });

  var nPair = Q.filter(function(q){return q.t==="pair"}).length;
  var nSec  = Q.length - nPair;
  function ansOf(q){ return q.t==="pair" ? V.pair[q.key] : V.sec[q.key]; }
  function doneCount(){ return Q.filter(function(q){ return !!ansOf(q) }).length; }

  // 그 칸이 "어떤 물건인지" 보여줄 우리 쪽 사진 — 제조사 실사 우선, 없으면 도면
  function refPics(sec, n){
    var all = [];
    (sec.parts||[]).forEach(function(p){ all = all.concat(p.photos.map(function(x){ return {p:p,x:x} })); });
    var mfr  = all.filter(function(o){ return o.x.k==="mfr" });
    var fld  = all.filter(function(o){ return o.x.k==="field" });
    var draw = all.filter(function(o){ return o.x.k==="draw" });
    return fld.concat(mfr, draw).slice(0, n||4);
  }
  function refName(sec){
    var p = (sec.parts||[])[0];
    return p ? p.name : "";
  }

  function picsEl(list, solo){
    var d = document.createElement("div");
    d.className = "pics" + (solo?" solo":"");
    list.forEach(function(o){
      var im = document.createElement("img");
      im.src = o.u || o.x.u; im.loading = "lazy"; im.alt = "";
      im.onclick = function(){ lbimg.src = im.src; lb.classList.add("on"); };
      im.onerror = function(){ im.style.display = "none"; };
      d.appendChild(im);
    });
    return d;
  }

  // ── 한 건씩 화면 ─────────────────────────────────────────────
  var focus = document.getElementById("focus"), ans = document.getElementById("ans"), ansin = document.getElementById("ansin");
  var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
  lb.onclick = function(){ lb.classList.remove("on"); };

  function drawFocus(){
    if (V.pos >= Q.length){ drawDone(); return; }
    var q = Q[V.pos];
    focus.innerHTML = ""; ans.style.display = "block";
    var card = document.createElement("div"); card.className = "qcard";
    var hd = document.createElement("div"); hd.className = "qhd";

    if (q.t === "pair"){
      hd.innerHTML = '<div class="qkind">짝 확인 · '
        + (q.ref ? '이 둘이 같은 물건인가요?' : '오른쪽 제품이 이 칸의 물건인가요?') + '</div>'
        + '<div class="qtitle">' + esc(q.sec.sec) + '</div>'
        + '<div class="qsub">맞으면 오른쪽 사진 ' + q.cand.total.field + '장을 이 칸에 끌어다 씁니다. 촬영이 그만큼 줄어듭니다.</div>';
      card.appendChild(hd);
      var cmp = document.createElement("div"); cmp.className = "cmp";
      var A = document.createElement("div"); A.className = "side";
      var refs = refPics(q.sec, 4);
      A.innerHTML = '<span class="slab a">이 칸의 물건 (카탈로그)</span>'
        + '<div class="sname">' + esc(refName(q.sec) || "(등록된 제품 없음)") + '</div>';
      A.appendChild(refs.length ? picsEl(refs) : nopic("이 칸에는 우리 쪽 사진이 없습니다. 아래 품목 이름과 견주어 보세요."));
      if (!refs.length){
        var ex = document.createElement("div"); ex.className = "qsub";
        ex.textContent = "품목 예: " + q.sec.items.slice(0,4).map(function(i){return i.model}).filter(Boolean).join(", ");
        A.appendChild(ex);
      }
      var B = document.createElement("div"); B.className = "side";
      B.innerHTML = '<span class="slab b">알옥션(자사몰)에 있는 제품</span>'
        + '<div class="sname">' + esc(q.cand.name) + '</div>';
      B.appendChild(picsEl(q.cand.photos.filter(function(p){return p.k!=="draw"}).slice(0,4)));
      cmp.appendChild(A); cmp.appendChild(B); card.appendChild(cmp);
      focus.appendChild(card);
      buttons([
        ["같은 물건이다", "사진을 끌어다 씁니다", "y", "y"],
        ["아니다 — 딴 물건", "잇지 않습니다", "n", "n"],
        ["모르겠다", "나중에 다시", "w", "?"]
      ], q);
    } else {
      var st = { ok:"사진 있음", thin:"사진 1~2장", mfr:"제조사 사진만", none:"사진 없음", nodb:"DB에 물건 없음" }[q.sec.state];
      hd.innerHTML = '<div class="qkind">칸 확인 · 이 칸 사진, 쓸 만한가요?</div>'
        + '<div class="qtitle">' + esc(q.sec.sec) + '</div>'
        + '<div class="qsub">' + st + ' · 품목 ' + q.sec.n + '개'
        + (q.sec.linked < q.sec.n ? ' (DB연결 ' + q.sec.linked + ')' : '')
        + ' · 손님계통 ' + q.sec.tot.field + '장 / 제조사 ' + q.sec.tot.mfr + '장 / 도면 ' + q.sec.tot.draw + '장</div>';
      card.appendChild(hd);
      var one = document.createElement("div"); one.className = "single";
      var pics = refPics(q.sec, 8);
      if (pics.length) one.appendChild(picsEl(pics));
      else one.appendChild(nopic(q.sec.linked===0
        ? "이 칸의 품목은 DB에 등록된 제품이 없습니다 — 사진 이전에 제품 수집이 필요합니다."
        : "사진이 없습니다."));
      var names = (q.sec.parts||[]).map(function(p){return p.name}).join(" · ");
      if (names){ var nm = document.createElement("div"); nm.className="qsub"; nm.style.marginTop="9px";
        nm.textContent = "제품: " + names; one.appendChild(nm); }
      var it = document.createElement("div"); it.className="qsub"; it.style.marginTop="6px";
      it.textContent = "품목 예: " + q.sec.items.slice(0,6).map(function(i){return i.model}).filter(Boolean).join(", ")
        + (q.sec.n>6 ? " 외 " + (q.sec.n-6) + "개" : "");
      one.appendChild(it);
      card.appendChild(one); focus.appendChild(card);
      buttons([
        ["쓸 만하다", "이 칸은 넘어갑니다", "y", "ok"],
        ["사진 부족 — 찍어야 함", "촬영 목록에 넣습니다", "w", "shoot"],
        ["딴 물건이 섞임", "사진을 걸러냅니다", "n", "bad"]
      ], q);
    }
    gauge();
    window.scrollTo(0,0);
  }

  function nopic(msg){
    var d = document.createElement("div"); d.className="nopic"; d.textContent = msg; return d;
  }

  function buttons(defs, q){
    ansin.innerHTML = "";
    var cur = ansOf(q);
    defs.forEach(function(d, i){
      var b = document.createElement("button");
      b.className = d[2] + (cur === d[3] ? " on" : "");
      b.innerHTML = esc(d[0]) + "<small>" + esc(d[1]) + " (" + (i+1) + ")</small>";
      b.onclick = function(){ answer(q, d[3]); };
      ansin.appendChild(b);
    });
    var sk = document.createElement("button"); sk.className = "s";
    sk.innerHTML = "건너뜀<small>→</small>";
    sk.onclick = function(){ V.pos++; save(); drawFocus(); };
    ansin.appendChild(sk);

    var nav = document.createElement("div"); nav.className = "nav";
    var back = document.createElement("button"); back.textContent = "← 이전";
    back.onclick = function(){ if (V.pos>0){ V.pos--; save(); drawFocus(); } };
    var skipAll = document.createElement("button");
    skipAll.textContent = q.t==="pair" ? "짝 확인 건너뛰고 칸 확인부터 →" : "남은 것 보기";
    skipAll.onclick = function(){ V.pos = q.t==="pair" ? nPair : V.pos+1; save(); drawFocus(); };
    nav.appendChild(back); nav.appendChild(skipAll);
    focus.appendChild(nav);
  }

  function answer(q, v){
    if (q.t==="pair"){ V.pair[q.key] = v; } else { V.sec[q.key] = v; }
    save(); V.pos++;
    drawFocus();
  }

  function drawDone(){
    ans.style.display = "none";
    var left = Q.filter(function(q){ return !ansOf(q) }).length;
    focus.innerHTML = "";
    var d = document.createElement("div"); d.className = "done";
    d.innerHTML = "<h2>" + (left ? "여기까지 보셨습니다" : "다 보셨습니다 🎉") + "</h2>"
      + "<p>판정 " + doneCount() + "건 / 전체 " + Q.length + "건"
      + (left ? " · 건너뛴 것 " + left + "건이 남아 있습니다." : "") + "</p>";
    var b1 = document.createElement("button"); b1.className="big"; b1.textContent="판정 내보내기";
    b1.onclick = exportJson; d.appendChild(b1);
    if (left){
      var b2 = document.createElement("button"); b2.className="big";
      b2.style.background="#fff"; b2.style.color="var(--ink)"; b2.style.border="1px solid var(--line)";
      b2.style.marginLeft="8px"; b2.textContent="건너뛴 것 다시 보기";
      b2.onclick = function(){
        for (var i=0;i<Q.length;i++) if (!ansOf(Q[i])){ V.pos=i; save(); drawFocus(); return; }
      };
      d.appendChild(b2);
    }
    var b3 = document.createElement("button"); b3.className="big";
    b3.style.background="#fff"; b3.style.color="var(--ink)"; b3.style.border="1px solid var(--line)";
    b3.style.marginLeft="8px"; b3.textContent="처음부터 다시";
    b3.onclick = function(){ V.pos=0; save(); drawFocus(); };
    d.appendChild(b3);
    focus.appendChild(d);
    gauge();
  }

  function gauge(){
    var dp = Q.filter(function(q){ return q.t==="pair" && ansOf(q) }).length;
    var ds = Q.filter(function(q){ return q.t==="sec" && ansOf(q) }).length;
    document.getElementById("pbar").style.width = Math.round(doneCount()/Q.length*100) + "%";
    document.getElementById("pnum").innerHTML =
      "<span>짝 확인 " + dp + "/" + nPair + "</span><span>칸 확인 " + ds + "/" + nSec + "</span>"
      + (V.pos < Q.length ? "<span>지금 " + (V.pos+1) + "번째</span>" : "");
  }

  document.onkeydown = function(e){
    if (lb.classList.contains("on")){ lb.classList.remove("on"); return; }
    if (document.getElementById("focus").style.display === "none") return;
    if (V.pos >= Q.length) return;
    var q = Q[V.pos];
    if (e.key==="1"||e.key==="2"||e.key==="3"){
      var map = q.t==="pair" ? ["y","n","?"] : ["ok","shoot","bad"];
      answer(q, map[+e.key-1]);
    } else if (e.key==="ArrowRight"){ V.pos++; save(); drawFocus(); }
    else if (e.key==="ArrowLeft"){ if (V.pos>0){ V.pos--; save(); drawFocus(); } }
  };

  // ── 전체 목록 (훑어보기용 — 사진은 6장까지만 펼친다) ──────────
  var STATE = { ok:["사진 있음","t-ok"], thin:["사진 1~2장","t-thin"], mfr:["제조사 사진만","t-mfr"],
                none:["사진 없음","t-none"], nodb:["DB에 물건 없음","t-nodb"] };
  function drawList(){
    var list = document.getElementById("list"); list.innerHTML = "";
    D.sections.forEach(function(sec){
      var el = document.createElement("section"); el.className = "sec" + (sec.__open?" open":"");
      var hd = document.createElement("div"); hd.className="sechd";
      var v = V.sec[sec.sec];
      hd.innerHTML = '<h2>' + esc(sec.sec) + '</h2>'
        + '<span class="tag ' + STATE[sec.state][1] + '">' + STATE[sec.state][0] + '</span>'
        + (v ? '<span class="verdict ' + (v==="ok"?"v-y":v==="shoot"?"v-w":"v-n") + '">'
             + (v==="ok"?"쓸 만함":v==="shoot"?"촬영 필요":"딴 물건 섞임") + '</span>' : '')
        + '<span class="cnt">품목 ' + sec.n + ' · 손님계통 ' + sec.tot.field + ' / 제조사 ' + sec.tot.mfr + ' / 도면 ' + sec.tot.draw + '</span>';
      hd.onclick = function(){ sec.__open = !sec.__open; drawList(); };
      el.appendChild(hd);
      var body = document.createElement("div"); body.className="body";
      if (!sec.parts.length) body.appendChild(nopic(sec.linked===0 ? "DB에 등록된 제품이 없습니다." : "사진이 없습니다."));
      sec.parts.forEach(function(p){
        var d = document.createElement("div"); d.className="part";
        var t2 = document.createElement("div"); t2.className="pname";
        t2.innerHTML = esc(p.name) + ' <span class="pmeta">손님계통 ' + p.total.field + ' · 제조사 ' + p.total.mfr + ' · 도면 ' + p.total.draw + '</span>';
        d.appendChild(t2);
        var shown = p.photos.filter(function(x){ return x.k!=="draw" });
        d.appendChild(stripEl(shown, p.__more));
        if (shown.length > 6 && !p.__more){
          var mb = document.createElement("button"); mb.className="more";
          mb.textContent = "+" + (shown.length-6) + "장 더";
          mb.onclick = function(){ p.__more = true; drawList(); };
          d.lastChild.appendChild(mb);
        }
        body.appendChild(d);
      });
      if (sec.cands && sec.cands.length){
        sec.cands.forEach(function(c){
          var d = document.createElement("div"); d.className="part";
          var vv = V.pair[sec.sec+"|"+c.pid];
          d.innerHTML = '<div class="pname">❓ 짝 후보: ' + esc(c.name)
            + (vv ? ' <span class="verdict ' + (vv==="y"?"v-y":vv==="n"?"v-n":"v-w") + '">'
                  + (vv==="y"?"같은 물건":vv==="n"?"딴 물건":"모르겠음") + '</span>' : '') + '</div>';
          d.appendChild(stripEl(c.photos.filter(function(x){ return x.k!=="draw" }), true));
          body.appendChild(d);
        });
      }
      el.appendChild(body); list.appendChild(el);
    });
  }
  function stripEl(photos, all){
    var d = document.createElement("div"); d.className="strip";
    if (!photos.length){ var e=document.createElement("span"); e.className="empty"; e.textContent="(사진 없음 · 도면 제외)"; d.appendChild(e); return d; }
    photos.slice(0, all?999:6).forEach(function(p){
      var im = document.createElement("img"); im.src=p.u; im.loading="lazy"; im.alt="";
      im.onclick = function(){ lbimg.src=p.u; lb.classList.add("on"); };
      im.onerror = function(){ im.style.display="none"; };
      d.appendChild(im);
    });
    return d;
  }

  // ── 내보내기 ────────────────────────────────────────────────
  function exportJson(){
    var out = { 만든날:new Date().toISOString().slice(0,10), 자료날짜:D.만든날,
                짝판정:{}, 칸판정:{}, 요약:{} };
    Q.forEach(function(q){
      var a = ansOf(q); if (!a) return;
      if (q.t==="pair") out.짝판정[q.key] = a==="y"?"같은 물건":a==="n"?"딴 물건":"모르겠음";
      else out.칸판정[q.key] = a==="ok"?"쓸 만함":a==="shoot"?"촬영 필요":"딴 물건 섞임";
    });
    out.요약 = {
      같은물건: Object.values(out.짝판정).filter(function(x){return x==="같은 물건"}).length,
      딴물건: Object.values(out.짝판정).filter(function(x){return x==="딴 물건"}).length,
      촬영필요칸: Object.values(out.칸판정).filter(function(x){return x==="촬영 필요"}).length,
      판정: doneCount(), 전체: Q.length
    };
    var blob = new Blob([JSON.stringify(out,null,1)], {type:"application/json"});
    var a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob); a2.download = "부품검수-" + out.만든날 + ".json";
    a2.click(); URL.revokeObjectURL(a2.href);
  }

  // ── 모드 전환 ───────────────────────────────────────────────
  var mF = document.getElementById("mFocus"), mL = document.getElementById("mList");
  function setMode(f){
    mF.classList.toggle("on", f); mL.classList.toggle("on", !f);
    document.getElementById("focus").style.display = f ? "block" : "none";
    document.getElementById("list").style.display = f ? "none" : "block";
    ans.style.display = f && V.pos < Q.length ? "block" : "none";
    if (f) drawFocus(); else drawList();
  }
  mF.onclick = function(){ setMode(true); };
  mL.onclick = function(){ setMode(false); };

  document.getElementById("h1").textContent = "댄포스 부품 사진 검수 · 판정 " + Q.length + "건";
  setMode(true);
})();
</script>
</body>
